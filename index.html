  if (!shopId) return navigateTo('#/explore');
  const mc = document.getElementById('main-content');
  mc.innerHTML = `<div class="ibl-container" style="padding-top:16px">${renderSkeleton('loading')}</div>`;
  const [shopRes, prodRes] = await Promise.all([
    API.get('getShop', { shopId }),
    API.get('getProducts', { shopId, pageSize: '60' })
  ]);
  if (!shopRes.success) { mc.innerHTML = `<div class="ibl-container">${emptyState('fa-store', 'Shop not found', 'This shop may no longer be available.')}</div>`; return; }
  const s = shopRes.data.shop;
  const prods = prodRes.success ? prodRes.data.products : [];
  mc.innerHTML = `<div class="ibl-container" style="padding-top:16px">
    <div class="ibl-shop-hero" style="${bgImg(s.ShopImage, s.ShopName)}">
      <div class="ibl-shop-hero__overlay"><div class="ibl-shop-hero__info">
        <h1>${escapeHtml(s.ShopName)}</h1>
        <div class="meta">
          <span><i class="fas fa-star" style="color:#F59E0B"></i> ${s.Rating || '—'} (${s.RatingCount || 0})</span>
          <span><i class="fas fa-map-marker-alt"></i> ${escapeHtml(s.Address)}</span>
          <span><i class="fas fa-clock"></i> ${s.OpeningTime}–${s.ClosingTime}</span>
          <span><i class="fas fa-motorcycle"></i> ${formatPrice(s.DeliveryFee)} delivery</span>
          ${s.MinOrder ? `<span>Min ${formatPrice(s.MinOrder)}</span>` : ''}
        </div>
      </div></div>
    </div>
    ${s.Description ? `<p class="text-muted mb-16">${escapeHtml(s.Description)}</p>` : ''}
    <div class="ibl-section-header"><h2>Products (${prods.length})</h2></div>
    ${prods.length ? `<div class="ibl-products-grid">${prods.map(renderProductCard).join('')}</div>` : emptyState('fa-box-open', 'No products yet', 'This shop hasn\'t added any products yet.')}
  </div>`;
}

// ── PRODUCT PAGE ──
async function renderProductPage(productId) {
  if (!productId) return navigateTo('#/explore');
  const mc = document.getElementById('main-content');
  mc.innerHTML = `<div class="ibl-container" style="padding-top:16px">${renderSkeleton('loading')}</div>`;
  const res = await API.get('getProduct', { productId });
  if (!res.success) { mc.innerHTML = `<div class="ibl-container">${emptyState('fa-box-open', 'Product not found', 'This product may no longer be available.')}</div>`; return; }
  const p = res.data.product;
  const shop = res.data.shop;
  const reviews = res.data.reviews || [];
  const price = Number(p.DiscountPrice) > 0 ? Number(p.DiscountPrice) : Number(p.Price);
  const origPrice = Number(p.Price);
  const disc = getDiscountPct(origPrice, Number(p.DiscountPrice));
  const inWish = STATE.wishlistIds.has(p.ProductID);
  const inStock = Number(p.Stock) > 0;

  mc.innerHTML = `<div class="ibl-container ibl-product-detail">
    <div class="ibl-product-detail__grid">
      <div class="ibl-product-detail__image">
        <img src="${escapeHtml(p.Image || '')}" alt="${escapeHtml(p.Name)}" onerror="imgError(this)" style="width:100%;height:420px;object-fit:cover;border-radius:var(--radius-lg)">
        ${disc > 0 ? `<div style="position:absolute;top:16px;left:16px;padding:6px 14px;border-radius:var(--radius-full);background:var(--c-danger);color:#fff;font-size:.85rem;font-weight:700">${disc}% OFF</div>` : ''}
      </div>
      <div class="ibl-product-detail__info">
        <h1>${escapeHtml(p.Name)}</h1>
        ${p.Brand ? `<div class="ibl-product-detail__brand">${escapeHtml(p.Brand)}</div>` : ''}
        <div class="ibl-product-detail__rating">
          <span style="color:#F59E0B">${renderStarRating(p.Rating)}</span>
          <span>${p.Rating || 0}</span>
          <span class="text-muted">(${p.ReviewCount || 0} reviews)</span>
        </div>
        <div class="ibl-product-detail__price">
          <span class="current">${formatPrice(price)}</span>
          ${disc > 0 ? `<span class="original">${formatPrice(origPrice)}</span><span class="discount-pct">Save ${disc}%</span>` : ''}
        </div>
        <p class="ibl-product-detail__desc">${escapeHtml(p.Description)}</p>
        <div class="ibl-product-detail__actions">
          <div class="ibl-product-detail__qty">
            <button onclick="changeDetailQty(-1)">−</button>
            <span id="detail-qty">1</span>
            <button onclick="changeDetailQty(1)">+</button>
          </div>
          <button class="ibl-btn ibl-btn--primary flex-1 ${!inStock ? 'disabled' : ''}" ${!inStock ? 'disabled' : ''} onclick="addToCartFromDetail('${p.ProductID}')">
            <i class="fas fa-shopping-bag"></i> ${inStock ? 'Add to Cart' : 'Out of Stock'}
          </button>
          <button class="ibl-btn ${inWish ? 'ibl-btn--danger' : 'ibl-btn--secondary'} ibl-btn--icon" onclick="toggleWishlist('${p.ProductID}',null);this.classList.toggle('ibl-btn--danger');this.classList.toggle('ibl-btn--secondary')">
            <i class="${inWish ? 'fas' : 'far'} fa-heart"></i>
          </button>
        </div>
        <div class="ibl-product-detail__meta">
          <div class="ibl-product-detail__meta-row"><span class="label">Category</span><span class="value">${escapeHtml(p.Category)}</span></div>
          <div class="ibl-product-detail__meta-row"><span class="label">Unit</span><span class="value">${escapeHtml(p.Unit || 'pc')}</span></div>
          <div class="ibl-product-detail__meta-row"><span class="label">Stock</span><span class="value">${inStock ? p.Stock + ' available' : '<span style="color:var(--c-danger)">Out of stock</span>'}</span></div>
          ${p.SKU ? `<div class="ibl-product-detail__meta-row"><span class="label">SKU</span><span class="value">${escapeHtml(p.SKU)}</span></div>` : ''}
        </div>
        ${shop ? `<div class="ibl-card--flat" style="padding:14px;margin-top:16px;border-radius:var(--radius-md);cursor:pointer" onclick="navigateTo('#/shop?id=${shop.ShopID}')">
          <div class="flex items-center gap-12">
            <div style="width:44px;height:44px;border-radius:var(--radius-sm);${bgImg(shop.ShopImage, shop.ShopName)};background-size:cover"></div>
            <div><div style="font-weight:600">${escapeHtml(shop.ShopName)}</div><div class="text-muted" style="font-size:.8rem">${escapeHtml(shop.Address || '')}</div></div>
          </div>
        </div>` : ''}
      </div>
    </div>
    <div style="margin-top:32px">
      <h2 style="margin-bottom:16px">Reviews (${reviews.length})</h2>
      ${reviews.length ? reviews.map(r => `
        <div class="ibl-review">
          <div class="ibl-review__header">
            <div class="ibl-review__avatar">${(r.CustomerName || 'U').charAt(0).toUpperCase()}</div>
            <div class="ibl-review__name">${escapeHtml(r.CustomerName)}</div>
            <div class="ibl-review__date">${timeAgo(r.CreatedAt)}</div>
          </div>
          <div class="ibl-review__stars">${renderStarRating(r.Rating)}</div>
          ${r.Comment ? `<div class="ibl-review__text">${escapeHtml(r.Comment)}</div>` : ''}
        </div>`).join('') : '<p class="text-muted">No reviews yet.</p>'}
    </div>
  </div>`;

function changeDetailQty(delta) {
  const el = document.getElementById('detail-qty');
  if (!el) return;
  const v = Math.max(1, parseInt(el.textContent) + delta);
  el.textContent = v;
}

async function addToCartFromDetail(productId) {
  if (!requireLogin()) return;
  const qty = parseInt(document.getElementById('detail-qty')?.textContent || '1');
  showLoading();
  const res = await API.post('addToCart', { productId, quantity: qty });
  hideLoading();
  if (res.success) {
    STATE.cart = res.data.cart;
    STATE.cartCount = STATE.cart.groups.reduce((s, g) => s + g.items.length, 0);
    updateCartBadge();
    showToast('Added to cart!', 'success');
  } else {
    showToast(res.message, 'error');
  }
}

async function addToCartQuick(productId) {
  if (!requireLogin()) return;
  const res = await API.post('addToCart', { productId, quantity: 1 });
  if (res.success) {
    STATE.cart = res.data.cart;
    STATE.cartCount = STATE.cart.groups.reduce((s, g) => s + g.items.length, 0);
    updateCartBadge();
    showToast('Added to cart!', 'success');
  } else {
    showToast(res.message, 'error');
  }
}

function requireLogin() {
  if (!STATE.user) { showAuthScreen('login'); showToast('Please sign in to continue.', 'info'); return false; }
  return true;
}

async function toggleWishlist(productId, el) {
  if (!requireLogin()) return;
  const res = await API.post('toggleWishlist', { productId });
  if (res.success) {
    if (res.data.inWishlist) { STATE.wishlistIds.add(productId); showToast('Added to wishlist', 'success'); }
    else { STATE.wishlistIds.delete(productId); showToast('Removed from wishlist', 'info'); }
    if (el) {
      el.classList.toggle('ibl-product-card__wishlist--active', res.data.inWishlist);
      el.querySelector('i').className = res.data.inWishlist ? 'fas fa-heart' : 'far fa-heart';
    }
  }
}

// ── CART PAGE ──
async function renderCartPage() {
  if (!requireLogin()) return;
  const mc = document.getElementById('main-content');
  mc.innerHTML = `<div class="ibl-container ibl-cart">${renderSkeleton('loading')}</div>`;
  const res = await API.get('getCart');
  if (res.success) { STATE.cart = res.data.cart; STATE.cartCount = STATE.cart.groups.reduce((s, g) => s + g.items.length, 0); updateCartBadge(); }
  const cart = STATE.cart;
  if (!cart.groups.length) {
    mc.innerHTML = `<div class="ibl-container ibl-cart">${emptyState('fa-shopping-bag', 'Your cart is empty', 'Your cart is waiting for something delicious.', 'Start Shopping', "navigateTo('#/explore')")}</div>`;
    return;
  }
  let itemsHtml = '';
  cart.groups.forEach(g => {
    itemsHtml += `<div class="ibl-cart__group">
      <div class="ibl-cart__group-header"><i class="fas fa-store" style="color:var(--c-primary)"></i><h3>${escapeHtml(g.shopName)}</h3>
      <span class="text-muted" style="font-size:.8rem">Delivery: ${formatPrice(g.deliveryFee)}${g.minOrder ? ' · Min ' + formatPrice(g.minOrder) : ''}</span></div>`;
    g.items.forEach(it => {
      itemsHtml += `<div class="ibl-cart__item">
        <div class="ibl-cart__item-img" style="${bgImg(it.image, it.name)}"></div>
        <div class="ibl-cart__item-info">
          <h4>${escapeHtml(it.name)}</h4>
          <div class="price">${formatPrice(it.price)} × ${it.quantity} = ${formatPrice(it.lineTotal)}</div>
        </div>
        <div class="ibl-cart__item-qty">
          <button onclick="updateCartQty('${it.productId}',${it.quantity - 1})">−</button>
          <span>${it.quantity}</span>
          <button onclick="updateCartQty('${it.productId}',${it.quantity + 1})">+</button>
        </div>
        <div class="ibl-cart__item-remove" onclick="removeCartItem('${it.productId}')"><i class="fas fa-trash"></i></div>
      </div>`;
    });
    itemsHtml += '</div>';
  });

  mc.innerHTML = `<div class="ibl-container ibl-cart">
    <div class="flex justify-between items-center mb-16">
      <h2>Your Cart (${STATE.cartCount})</h2>
      <button class="ibl-btn ibl-btn--ghost ibl-btn--sm" onclick="clearCartAction()"><i class="fas fa-trash"></i> Clear</button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start">
      <div>${itemsHtml}</div>
      <div class="ibl-cart__summary">
        <h3 style="margin-bottom:16px">Order Summary</h3>
        <div class="flex justify-between mb-8"><span>Subtotal</span><span style="font-weight:600">${formatPrice(cart.subtotal)}</span></div>
        <div style="border-top:1px solid var(--c-border);padding-top:12px;margin-top:12px" class="flex justify-between">
          <span style="font-weight:700;font-size:1.1rem">Estimated Total</span>
          <span style="font-weight:700;font-size:1.1rem;color:var(--c-primary)">${formatPrice(cart.subtotal)}</span>
        </div>
        <p class="text-muted" style="font-size:.75rem;margin-top:6px">Delivery fee & tax calculated at checkout.</p>
        <button class="ibl-btn ibl-btn--primary ibl-btn--full ibl-btn--lg mt-16" onclick="navigateTo('#/checkout')">Proceed to Checkout</button>
      </div>
    </div>
  </div>`;
  // Fix layout on mobile
  if (window.innerWidth <= 768) {
    const grid = mc.querySelector('[style*="grid-template-columns"]');
    if (grid) grid.style.gridTemplateColumns = '1fr';
  }
}

async function updateCartQty(productId, quantity) {
  if (quantity <= 0) { removeCartItem(productId); return; }
  const res = await API.post('updateCartItem', { productId, quantity });
  if (res.success) { STATE.cart = res.data.cart; STATE.cartCount = STATE.cart.groups.reduce((s, g) => s + g.items.length, 0); updateCartBadge(); renderCartPage(); }
  else showToast(res.message, 'error');
}

async function removeCartItem(productId) {
  const res = await API.post('removeCartItem', { productId });
  if (res.success) { STATE.cart = res.data.cart; STATE.cartCount = STATE.cart.groups.reduce((s, g) => s + g.items.length, 0); updateCartBadge(); renderCartPage(); showToast('Item removed.', 'info'); }
}

async function clearCartAction() {
  if (!confirm('Clear all items from your cart?')) return;
  const res = await API.post('clearCart');
  if (res.success) { STATE.cart = { groups: [], subtotal: 0 }; STATE.cartCount = 0; updateCartBadge(); renderCartPage(); showToast('Cart cleared.', 'info'); }
}

// ── CHECKOUT PAGE ──
async function renderCheckoutPage() {
  if (!requireLogin()) return;
  if (!STATE.cart.groups.length) { navigateTo('#/cart'); return; }
  const mc = document.getElementById('main-content');
  STATE.checkoutStep = STATE.checkoutStep || 1;
  STATE.checkoutCoupon = STATE.checkoutCoupon || null;

  mc.innerHTML = `<div class="ibl-container ibl-checkout">
    <div class="ibl-checkout__steps">
      <div class="ibl-checkout__step ${STATE.checkoutStep >= 1 ? (STATE.checkoutStep > 1 ? 'ibl-checkout__step--done' : 'ibl-checkout__step--active') : ''}">1. Address</div>
      <div class="ibl-checkout__step ${STATE.checkoutStep >= 2 ? (STATE.checkoutStep > 2 ? 'ibl-checkout__step--done' : 'ibl-checkout__step--active') : ''}">2. Review</div>
      <div class="ibl-checkout__step ${STATE.checkoutStep >= 3 ? 'ibl-checkout__step--active' : ''}">3. Payment</div>
    </div>
    <div id="checkout-content"></div>
  </div>`;

  if (STATE.checkoutStep === 1) renderCheckoutAddress();
  else if (STATE.checkoutStep === 2) renderCheckoutReview();
  else renderCheckoutPayment();
}

async function renderCheckoutAddress() {
  const el = document.getElementById('checkout-content');
  el.innerHTML = renderSkeleton('loading');
  const res = await API.get('getAddresses');
  const addresses = res.success ? res.data.addresses : [];

  let html = '<h3 style="margin-bottom:16px">Select Delivery Address</h3>';
  if (addresses.length) {
    html += '<div class="grid-2">';
    addresses.forEach(a => {
      const sel = STATE.checkoutAddress && STATE.checkoutAddress.AddressID === a.AddressID;
      html += `<div class="ibl-address-card ${sel ? 'ibl-address-card--selected' : ''}" onclick="selectCheckoutAddress(${escapeHtml(JSON.stringify(JSON.stringify(a)))})">
        <div class="ibl-address-card__label"><i class="fas fa-map-pin"></i> ${escapeHtml(a.Label)}</div>
        <div class="ibl-address-card__text">${escapeHtml(a.FullAddress)}</div>
        <div class="ibl-address-card__meta">${[a.Area, a.City, a.Pincode].filter(Boolean).join(', ')}</div>
      </div>`;
    });
    html += '</div>';
  }
  html += `<button class="ibl-btn ibl-btn--ghost mt-16" onclick="showAddAddressModal()"><i class="fas fa-plus"></i> Add New Address</button>`;
  html += `<div class="flex justify-between mt-24"><span></span><button class="ibl-btn ibl-btn--primary" onclick="goCheckoutStep(2)" ${!STATE.checkoutAddress ? 'disabled' : ''} id="checkout-next-btn">Continue →</button></div>`;
  el.innerHTML = html;
}

function selectCheckoutAddress(jsonStr) {
  STATE.checkoutAddress = JSON.parse(jsonStr);
  renderCheckoutAddress();
}

function goCheckoutStep(step) {
  if (step === 2 && !STATE.checkoutAddress) { showToast('Please select a delivery address.', 'error'); return; }
  STATE.checkoutStep = step;
  renderCheckoutPage();
}

async function renderCheckoutReview() {
  const el = document.getElementById('checkout-content');
  const cart = STATE.cart;
  let html = '<h3 style="margin-bottom:16px">Order Review</h3>';
  html += `<div class="ibl-card--flat" style="padding:14px;border-radius:var(--radius-md);margin-bottom:16px">
    <div class="flex items-center gap-8"><i class="fas fa-map-marker-alt" style="color:var(--c-primary)"></i>
    <div><strong>${escapeHtml(STATE.checkoutAddress.Label)}</strong><br><span class="text-muted" style="font-size:.85rem">${escapeHtml(STATE.checkoutAddress.FullAddress)}, ${escapeHtml(STATE.checkoutAddress.City)} ${escapeHtml(STATE.checkoutAddress.Pincode || '')}</span></div></div>
  </div>`;
  cart.groups.forEach(g => {
    html += `<div class="ibl-card--flat" style="padding:14px;border-radius:var(--radius-md);margin-bottom:12px">
      <div style="font-weight:700;margin-bottom:8px"><i class="fas fa-store" style="color:var(--c-primary)"></i> ${escapeHtml(g.shopName)}</div>`;
    g.items.forEach(it => {
      html += `<div class="flex items-center gap-8 mb-8" style="font-size:.85rem">
        <div style="width:40px;height:40px;border-radius:6px;${bgImg(it.image, it.name)};background-size:cover;flex-shrink:0"></div>
        <div class="flex-1">${escapeHtml(it.name)} × ${it.quantity}</div>
        <div style="font-weight:600">${formatPrice(it.lineTotal)}</div>
      </div>`;
    });
    html += `<div class="flex justify-between text-muted" style="font-size:.85rem;padding-top:8px;border-top:1px solid var(--c-border)"><span>Shop subtotal</span><span style="font-weight:600">${formatPrice(g.shopSubtotal)}</span></div></div>`;
  });

  html += `<div class="ibl-card--flat" style="padding:14px;border-radius:var(--radius-md);margin-top:16px">
    <div class="flex gap-8 items-center">
      <input type="text" id="coupon-input" placeholder="Coupon code" style="flex:1">
      <button class="ibl-btn ibl-btn--secondary ibl-btn--sm" onclick="applyCoupon()">Apply</button>
    </div>
    <div id="coupon-result" class="mt-8"></div>
  </div>`;
  if (STATE.checkoutCoupon) {
    html += `<div style="padding:8px 14px;background:#DCFCE7;border-radius:var(--radius-sm);margin-top:8px;font-size:.85rem;color:#15803D">
      <i class="fas fa-check-circle"></i> Coupon ${escapeHtml(STATE.checkoutCoupon.code)} applied — saving ${formatPrice(STATE.checkoutCoupon.discount)}
    </div>`;
  }
  html += `<div class="flex justify-between mt-24"><button class="ibl-btn ibl-btn--ghost" onclick="goCheckoutStep(1)">← Back</button><button class="ibl-btn ibl-btn--primary" onclick="goCheckoutStep(3)">Continue →</button></div>`;
  el.innerHTML = html;
}

async function applyCoupon() {
  const code = document.getElementById('coupon-input').value.trim();
  if (!code) return;
  const res = await API.post('validateCoupon', { code, subtotal: STATE.cart.subtotal });
  const el = document.getElementById('coupon-result');
  if (res.success) {
    STATE.checkoutCoupon = res.data;
    el.innerHTML = `<span style="color:var(--c-success);font-size:.85rem"><i class="fas fa-check-circle"></i> You save ${formatPrice(res.data.discount)}!</span>`;

async function placeOrder() {
  const btn = document.getElementById('place-order-btn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div> Placing...';
  const res = await API.post('createOrder', {
    deliveryAddress: JSON.stringify(STATE.checkoutAddress),
    paymentMethod: document.getElementById('payment-method').value,
    couponCode: STATE.checkoutCoupon ? STATE.checkoutCoupon.code : ''
  });
  if (res.success) {
    STATE.cart = { groups: [], subtotal: 0 };
    STATE.cartCount = 0;
    STATE.checkoutStep = 1;
    STATE.checkoutAddress = null;
    STATE.checkoutCoupon = null;
    updateCartBadge();
    STATE.pageParams.orderIds = res.data.orderIds.join(',');
    navigateTo('#/confirmation');
  } else {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-check"></i> Place Order';
    showToast(res.message, 'error');
  }
}

async function renderOrdersPage() {

function renderOrderCard(o) {
  const items = o.items || [];
  const canCancel = ['Order Placed', 'Confirmed', 'Preparing', 'Ready for Pickup'].includes(o.OrderStatus);
  const canReview = o.OrderStatus === 'Delivered';
  return `<div class="ibl-order-card">
    <div class="ibl-order-card__header">
      <div><div class="ibl-order-card__id">${escapeHtml(o.OrderID)}</div><div class="text-muted" style="font-size:.8rem">${formatDateTime(o.CreatedAt)}</div></div>
      ${statusBadge(o.OrderStatus)}
    </div>
    <div class="ibl-order-card__items">
      ${items.slice(0, 3).map(it => `<div class="ibl-order-card__item"><span>${escapeHtml(it.ProductName)} × ${it.Quantity}</span><span style="font-weight:600">${formatPrice(it.Subtotal)}</span></div>`).join('')}
      ${items.length > 3 ? `<div class="text-muted" style="font-size:.8rem">+ ${items.length - 3} more items</div>` : ''}
    </div>
    <div class="ibl-order-card__footer">
      <div class="ibl-order-card__total">Total: ${formatPrice(o.Total)}</div>
      <div class="flex gap-8">
        ${canCancel ? `<button class="ibl-btn ibl-btn--ghost ibl-btn--sm" onclick="cancelOrderAction('${o.OrderID}')">Cancel</button>` : ''}
        ${canReview ? `<button class="ibl-btn ibl-btn--ghost ibl-btn--sm" onclick="showReviewModal('${o.OrderID}', '${items.length ? items[0].ProductID : ''}')"><i class="fas fa-star"></i> Review</button>` : ''}
        <button class="ibl-btn ibl-btn--primary ibl-btn--sm" onclick="navigateTo('#/track?id=${o.OrderID}')"><i class="fas fa-map-marker-alt"></i> Track</button>
      </div>
    </div>
  </div>`;
}

async function cancelOrderAction(orderId) {
  if (!confirm('Cancel this order?')) return;
  showLoading();
  const res = await API.post('cancelOrder', { orderId });
  hideLoading();
  if (res.success) { showToast('Order cancelled.', 'info'); renderOrdersPage(); }
  else showToast(res.message, 'error');
}

// ── ORDER TRACKING PAGE ──
async function renderTrackOrderPage(orderId) {
  if (!requireLogin()) return;
  if (!orderId) return navigateTo('#/orders');
  const mc = document.getElementById('main-content');
  mc.innerHTML = `<div class="ibl-container" style="padding-top:16px">${renderSkeleton('loading')}</div>`;
  const res = await API.get('trackOrder', { orderId });
  if (!res.success) { mc.innerHTML = `<div class="ibl-container">${emptyState('fa-box', 'Order not found', '')}</div>`; return; }
  const o = res.data.order;
  const delivery = res.data.delivery;
  const timeline = res.data.timeline || [];
  const currentIdx = timeline.indexOf(o.OrderStatus);
  const isCancelled = o.OrderStatus === 'Cancelled';
  const isReturned = o.OrderStatus === 'Returned';

  let timelineHtml = '';
  if (isCancelled || isReturned) {
    timelineHtml = `<div class="ibl-timeline__item ibl-timeline__item--current"><div class="ibl-timeline__dot" style="background:var(--c-danger);border-color:var(--c-danger)"><i class="fas fa-times"></i></div><div class="ibl-timeline__label">${o.OrderStatus}</div></div>`;
  } else {
    timeline.forEach((s, i) => {
      const done = i < currentIdx;
      const current = i === currentIdx;
      timelineHtml += `<div class="ibl-timeline__item ${done ? 'ibl-timeline__item--done' : ''} ${current ? 'ibl-timeline__item--current' : ''}">
        <div class="ibl-timeline__dot">${done ? '<i class="fas fa-check"></i>' : current ? '<i class="fas fa-circle" style="font-size:.4rem"></i>' : ''}</div>
        <div class="ibl-timeline__label">${escapeHtml(s)}</div>
      </div>`;
    });
  }

  mc.innerHTML = `<div class="ibl-container" style="padding-top:16px">
    <div class="flex items-center gap-12 mb-24"><button class="ibl-btn ibl-btn--ghost ibl-btn--icon" onclick="navigateTo('#/orders')"><i class="fas fa-arrow-left"></i></button><h2>Track Order</h2></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start">
      <div>
        <div class="ibl-card--flat" style="padding:18px;border-radius:var(--radius-md);margin-bottom:16px">
          <div class="flex justify-between items-center mb-8"><span class="text-muted" style="font-size:.85rem">${escapeHtml(o.OrderID)}</span>${statusBadge(o.OrderStatus)}</div>
          <div class="text-muted" style="font-size:.85rem">${formatDateTime(o.CreatedAt)}</div>
        </div>
        <div class="ibl-card--flat" style="padding:18px;border-radius:var(--radius-md);margin-bottom:16px">
          <h3 style="margin-bottom:12px;font-size:1rem">Order Timeline</h3>
          <div class="ibl-timeline">${timelineHtml}</div>
        </div>
        ${delivery ? `<div class="ibl-card--flat" style="padding:18px;border-radius:var(--radius-md)">
          <h3 style="margin-bottom:8px;font-size:1rem">Delivery Info</h3>
          ${delivery.DeliveryPerson ? `<div class="flex items-center gap-8 mb-8"><i class="fas fa-user" style="color:var(--c-primary)"></i><span>${escapeHtml(delivery.DeliveryPerson)}</span></div>` : '<p class="text-muted" style="font-size:.85rem">Delivery person not assigned yet.</p>'}
          ${delivery.Phone ? `<div class="flex items-center gap-8"><i class="fas fa-phone" style="color:var(--c-primary)"></i><span>${escapeHtml(delivery.Phone)}</span></div>` : ''}
        </div>` : ''}
      </div>
      <div>
        <div class="ibl-rider-anim" style="margin-bottom:24px;height:160px">
          <div class="ibl-rider-anim__shop"><i class="fas fa-store"></i><span>Shop</span></div>
          <div class="ibl-rider-anim__dest"><i class="fas fa-map-marker-alt"></i><span>You</span></div>
          <div class="ibl-rider-anim__road"></div>
          <div class="ibl-rider-anim__rider"><div class="ibl-rider-anim__scooter">🛵</div></div>
        </div>
        <div class="ibl-card--flat" style="padding:18px;border-radius:var(--radius-md)">
          <h3 style="margin-bottom:12px;font-size:1rem">Items</h3>
          ${(o.items || []).map(it => `<div class="flex justify-between mb-8" style="font-size:.85rem"><span>${escapeHtml(it.ProductName)} × ${it.Quantity}</span><span style="font-weight:600">${formatPrice(it.Subtotal)}</span></div>`).join('')}
          <div style="border-top:1px solid var(--c-border);padding-top:8px;margin-top:8px">
            <div class="flex justify-between mb-4 text-muted" style="font-size:.85rem"><span>Subtotal</span><span>${formatPrice(o.Subtotal)}</span></div>
            ${Number(o.Discount) > 0 ? `<div class="flex justify-between mb-4" style="font-size:.85rem;color:var(--c-success)"><span>Discount</span><span>-${formatPrice(o.Discount)}</span></div>` : ''}
            <div class="flex justify-between mb-4 text-muted" style="font-size:.85rem"><span>Delivery</span><span>${formatPrice(o.DeliveryFee)}</span></div>
            <div class="flex justify-between mb-4 text-muted" style="font-size:.85rem"><span>Tax</span><span>${formatPrice(o.Tax)}</span></div>
            <div class="flex justify-between" style="font-weight:700;font-size:1rem;padding-top:8px;border-top:1px solid var(--c-border)"><span>Total</span><span style="color:var(--c-primary)">${formatPrice(o.Total)}</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>`;
  if (window.innerWidth <= 768) {
    const grid = mc.querySelector('[style*="grid-template-columns: 1fr 1fr"]') || mc.querySelector('[style*="grid-template-columns:1fr 1fr"]');
    if (grid) grid.style.gridTemplateColumns = '1fr';
  }
  // Auto-refresh for active orders
  if (!isCancelled && !isReturned && o.OrderStatus !== 'Delivered') {
    STATE.refreshTimers.track = setInterval(() => { if (STATE.currentPage === 'track') renderTrackOrderPage(orderId); }, 30000);
  }
}

// ── REVIEW MODAL ──
function showReviewModal(orderId, productId) {
  showModal('Write a Review', `
    <div class="ibl-star-input mb-16" id="review-stars" data-rating="5">
      ${[1,2,3,4,5].map(i => `<i class="fas fa-star active" data-val="${i}" onclick="setReviewStar(${i})"></i>`).join('')}
    </div>
    <div class="ibl-form-group"><label>Comment (optional)</label><textarea id="review-comment" rows="3" placeholder="Share your experience..."></textarea></div>
    <button class="ibl-btn ibl-btn--primary ibl-btn--full" onclick="submitReview('${orderId}','${productId}')">Submit Review</button>`);
}

function setReviewStar(val) {
  document.getElementById('review-stars').dataset.rating = val;
  document.querySelectorAll('#review-stars i').forEach(s => {
    s.classList.toggle('active', parseInt(s.dataset.val) <= val);
  });
}

async function submitReview(orderId, productId) {
  const rating = document.getElementById('review-stars').dataset.rating;
  const comment = document.getElementById('review-comment').value;
  showLoading();
  const res = await API.post('addReview', { orderId, productId, rating, comment });
  hideLoading();
  closeModal();
  if (res.success) showToast('Review submitted! Thank you!', 'success');
  else showToast(res.message, 'error');
}

async function renderNotificationsPage() {

function showAddAddressModal() {

      <select id="addr-label"><option>Home</option><option>Work</option><option>Other</option></select></div>

    </div>
    <div class="grid-2">

      <div class="ibl-form-group"><label>Pincode</label><input id="addr-pincode" placeholder="6-digit pincode"></div>
    </div>
    <button class="ibl-btn ibl-btn--primary ibl-btn--full mt-8" onclick="saveAddress()">Save Address</button>`);
}

async function saveAddress() {
  const data = {
    label: document.getElementById('addr-label').value,
    fullAddress: document.getElementById('addr-full').value.trim(),
    landmark: document.getElementById('addr-landmark').value.trim(),
    area: document.getElementById('addr-area').value.trim(),
    city: document.getElementById('addr-city').value.trim(),
    pincode: document.getElementById('addr-pincode').value.trim(),
    latitude: STATE.location ? STATE.location.lat : '',
    longitude: STATE.location ? STATE.location.lng : ''
  };
  if (!data.fullAddress || !data.city || !data.pincode) { showToast('Full address, city and pincode are required.', 'error'); return; }
  showLoading();
  const res = await API.post('addAddress', data);
  hideLoading();
  closeModal();
  if (res.success) { showToast('Address saved!', 'success'); if (STATE.currentPage === 'addresses') renderAddressesPage(); else if (STATE.currentPage === 'checkout') renderCheckoutAddress(); }
  else showToast(res.message, 'error');
}

async function deleteAddress(id) {
  if (!confirm('Delete this address?')) return;
  await API.post('deleteAddress', { addressId: id });
  showToast('Address deleted.', 'info');
  renderAddressesPage();
}

    <div style="padding:12px 20px 16px;font-family:var(--font-heading);font-weight:700;font-size:1.1rem;color:var(--c-primary)"><i class="fas fa-store"></i> Merchant</div>
    ${items.map(it => `<div class="ibl-panel__sidebar-item ${active === it.id ? 'ibl-panel__sidebar-item--active' : ''}" onclick="navigateTo('#/${it.id}')"><i class="fas ${it.icon}"></i>${it.label}</div>`).join('')}

function merchantMobileNav(active) {

// ── MERCHANT DASHBOARD ──
async function renderMerchantDashboard() {
  const mc = document.getElementById('main-content');
  mc.innerHTML = `${merchantSidebar('merchant')}<div class="ibl-panel__content">${renderSkeleton('cards')}</div>${merchantMobileNav('merchant')}`;

  content.innerHTML = `
    <h2 class="ibl-panel__page-title">Dashboard</h2>
    <div class="ibl-stats-grid">
      ${statCard('fa-box', 'primary', s.todayOrders, "Today's Orders")}
      ${statCard('fa-boxes-stacked', 'info', s.totalOrders, 'Total Orders')}
      ${statCard('fa-indian-rupee-sign', 'success', formatPrice(s.todaySales), "Today's Sales")}
      ${statCard('fa-wallet', 'purple', formatPrice(s.totalSales), 'Total Sales')}
      ${statCard('fa-clock', 'warning', s.pendingOrders, 'Pending Orders')}
      ${statCard('fa-tags', 'info', s.products, 'Products')}

      <th>Order</th><th>Date</th><th>Items</th><th>Total</th><th>Status</th><th>Action</th>
    </tr></thead><tbody>${orders.map(o => `<tr>
      <td style="font-weight:600">${escapeHtml(o.OrderID)}</td>
      <td>${formatDate(o.CreatedAt)}</td>
      <td>${(o.items || []).length}</td>
      <td style="font-weight:600">${formatPrice(o.Total)}</td>
      <td>${statusBadge(o.OrderStatus)}</td>

    </tr>`).join('')}</tbody></table></div>` : '<p class="text-muted">No orders yet.</p>'}`;
}

function statCard(icon, color, value, label) {
  return `<div class="ibl-stat-card"><div class="ibl-stat-card__icon ibl-stat-card__icon--${color}"><i class="fas ${icon}"></i></div><div class="ibl-stat-card__value">${value}</div><div class="ibl-stat-card__label">${label}</div></div>`;
}

// ── MERCHANT ORDERS ──
async function renderMerchantOrders() {
  const mc = document.getElementById('main-content');
  mc.innerHTML = `${merchantSidebar('merchant/orders')}<div class="ibl-panel__content"><h2 class="ibl-panel__page-title">Orders</h2>${renderSkeleton('loading')}</div>${merchantMobileNav('merchant/orders')}`;
  const res = await API.get('getMerchantOrders');
  const content = mc.querySelector('.ibl-panel__content');
  if (!res.success) { content.innerHTML += `<p class="text-muted">${escapeHtml(res.message)}</p>`; return; }
  const orders = res.data.orders || [];

  const statuses = ['All', 'Order Placed', 'Confirmed', 'Preparing', 'Ready for Pickup', 'Picked Up', 'Out for Delivery', 'Delivered', 'Cancelled'];
  content.innerHTML = `<h2 class="ibl-panel__page-title">Orders (${orders.length})</h2>
    <div class="ibl-filter-bar mb-16">${statuses.map(s => `<div class="ibl-filter-chip" onclick="filterMerchantOrders('${s === 'All' ? '' : s}')">${s}</div>`).join('')}</div>
    <div id="merchant-orders-list">${renderMerchantOrdersTable(orders)}</div>`;
  // Auto refresh
  STATE.refreshTimers.mOrders = setInterval(() => { if (STATE.currentPage === 'merchant/orders') renderMerchantOrders(); }, 30000);
}

async function filterMerchantOrders(status) {
  const params = status ? { status } : {};
  const res = await API.get('getMerchantOrders', params);
  if (res.success) document.getElementById('merchant-orders-list').innerHTML = renderMerchantOrdersTable(res.data.orders);
}

function renderMerchantOrdersTable(orders) {
  if (!orders.length) return '<p class="text-muted text-center" style="padding:24px">No orders found.</p>';
  return `<div class="ibl-table-wrap"><table class="ibl-table"><thead><tr>
    <th>Order</th><th>Date</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th><th>Action</th>
  </tr></thead><tbody>${orders.map(o => `<tr>
    <td style="font-weight:600;cursor:pointer" onclick="showMerchantOrderDetail('${o.OrderID}')">${escapeHtml(o.OrderID)}</td>
    <td>${formatDate(o.CreatedAt)}</td>
    <td>${(o.items || []).length}</td>
    <td style="font-weight:600">${formatPrice(o.Total)}</td>
    <td>${statusBadge(o.PaymentStatus)}</td>
    <td>${statusBadge(o.OrderStatus)}</td>
    <td><button class="ibl-btn ibl-btn--primary ibl-btn--sm" onclick="showMerchantOrderDetail('${o.OrderID}')">Manage</button></td>
  </tr>`).join('')}</tbody></table></div>`;
}

async function showMerchantOrderDetail(orderId) {
  showLoading();
  const res = await API.get('getOrder', { orderId });
  hideLoading();
  if (!res.success) { showToast(res.message, 'error'); return; }
  const o = res.data.order;
  let addr = {};
  try { addr = typeof o.deliveryAddress === 'string' ? JSON.parse(o.deliveryAddress) : (o.deliveryAddress || {}); } catch(e) { addr = o.deliveryAddress || {}; }

  const nextStatuses = getNextStatuses(o.OrderStatus);
  showModal('Order ' + o.OrderID, `
    <div class="flex justify-between items-center mb-16"><span class="text-muted">${formatDateTime(o.CreatedAt)}</span>${statusBadge(o.OrderStatus)}</div>
    <h4 style="margin-bottom:8px">Items</h4>
    ${(o.items || []).map(it => `<div class="flex justify-between mb-6" style="font-size:.85rem"><span>${escapeHtml(it.ProductName)} × ${it.Quantity}</span><span style="font-weight:600">${formatPrice(it.Subtotal)}</span></div>`).join('')}
    <div style="border-top:1px solid var(--c-border);padding-top:8px;margin:12px 0">
      <div class="flex justify-between" style="font-weight:700"><span>Total</span><span style="color:var(--c-primary)">${formatPrice(o.Total)}</span></div>
    </div>
    <h4 style="margin:12px 0 8px">Delivery Address</h4>
    <p class="text-muted" style="font-size:.85rem">${escapeHtml(addr.FullAddress || addr.fullAddress || JSON.stringify(addr))}</p>
    ${nextStatuses.length ? `<h4 style="margin:16px 0 8px">Update Status</h4>
      <div class="flex gap-8 flex-wrap">${nextStatuses.map(s => `<button class="ibl-btn ibl-btn--primary ibl-btn--sm" onclick="updateMerchantOrderStatus('${orderId}','${s}')">${s}</button>`).join('')}</div>` : ''}
    <h4 style="margin:16px 0 8px">Assign Delivery</h4>
    <div class="grid-2">
      <input id="del-person" placeholder="Delivery person name">
      <input id="del-phone" placeholder="Phone">
    </div>
    <button class="ibl-btn ibl-btn--secondary ibl-btn--sm mt-8" onclick="assignDeliveryPerson('${orderId}')">Assign</button>
  `, null, true);
}

function getNextStatuses(current) {
  const flow = ['Order Placed', 'Confirmed', 'Preparing', 'Ready for Pickup', 'Picked Up', 'Out for Delivery', 'Delivered'];
  const idx = flow.indexOf(current);
  if (idx === -1 || idx >= flow.length - 1) return [];
  return flow.slice(idx + 1);
}

async function updateMerchantOrderStatus(orderId, status) {
  showLoading();
  const res = await API.post('updateOrderStatus', { orderId, status });
  hideLoading();
  if (res.success) { showToast('Status updated!', 'success'); closeModal(); renderMerchantOrders(); }
  else showToast(res.message, 'error');
}

async function assignDeliveryPerson(orderId) {
  const person = document.getElementById('del-person').value.trim();
  const phone = document.getElementById('del-phone').value.trim();
  if (!person) { showToast('Enter delivery person name.', 'error'); return; }
  const res = await API.post('assignDelivery', { orderId, deliveryPerson: person, phone });
  if (res.success) { showToast('Delivery person assigned!', 'success'); closeModal(); }
  else showToast(res.message, 'error');
}

// ── MERCHANT PRODUCTS ──
async function renderMerchantProducts() {
  const mc = document.getElementById('main-content');
  mc.innerHTML = `${merchantSidebar('merchant/products')}<div class="ibl-panel__content">
    <div class="flex justify-between items-center mb-16"><h2 class="ibl-panel__page-title" style="margin:0">Products</h2>
    <button class="ibl-btn ibl-btn--primary" onclick="showAddProductModal()"><i class="fas fa-plus"></i> Add Product</button></div>
    <div id="merchant-products-list">${renderSkeleton('loading')}</div>
  </div>${merchantMobileNav('merchant/products')}`;

  const prods = res.data.products;
  el.innerHTML = `<div class="ibl-table-wrap"><table class="ibl-table"><thead><tr>
    <th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Disc.</th><th>Stock</th><th>Rating</th><th>Active</th><th>Actions</th>
  </tr></thead><tbody>${prods.map(p => {
    const isActive = p.Active === true || p.Active === 'TRUE' || p.Active === 'true';
    return `<tr>
      <td><div style="width:44px;height:44px;border-radius:6px;${bgImg(p.Image, p.Name)};background-size:cover"></div></td>
      <td style="font-weight:600;max-width:180px" class="truncate">${escapeHtml(p.Name)}</td>
      <td>${escapeHtml(p.Category)}</td>
      <td>${formatPrice(p.Price)}</td>
      <td>${Number(p.DiscountPrice) > 0 ? formatPrice(p.DiscountPrice) : '—'}</td>
      <td>${Number(p.Stock) <= 5 ? `<span style="color:var(--c-danger);font-weight:600">${p.Stock}</span>` : p.Stock}</td>
      <td>⭐ ${p.Rating || '—'}</td>
      <td>${isActive ? '<span class="ibl-badge ibl-badge--success">Active</span>' : '<span class="ibl-badge ibl-badge--danger">Disabled</span>'}</td>
      <td><div class="flex gap-4">
        <button class="ibl-btn ibl-btn--ghost ibl-btn--sm" onclick="showEditProductModal('${p.ProductID}')"><i class="fas fa-edit"></i></button>
        <button class="ibl-btn ibl-btn--ghost ibl-btn--sm" onclick="toggleProductActive('${p.ProductID}')">${isActive ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>'}</button>
        <button class="ibl-btn ibl-btn--ghost ibl-btn--sm" style="color:var(--c-danger)" onclick="deleteMerchantProduct('${p.ProductID}')"><i class="fas fa-trash"></i></button>
      </div></td>
    </tr>`;
  }).join('')}</tbody></table></div>`;
}

function showAddProductModal() {
  showModal('Add Product', productFormHtml(), null, true);
}

function productFormHtml(p) {
  p = p || {};
  return `
    <div class="grid-2">
      <div class="ibl-form-group"><label>Name *</label><input id="pf-name" value="${escapeHtml(p.Name || '')}"></div>
      <div class="ibl-form-group"><label>Category</label><input id="pf-category" value="${escapeHtml(p.Category || '')}" placeholder="e.g. Groceries"></div>
    </div>
    <div class="ibl-form-group"><label>Description</label><textarea id="pf-desc" rows="2">${escapeHtml(p.Description || '')}</textarea></div>
    <div class="grid-2">
      <div class="ibl-form-group"><label>Price (₹) *</label><input type="number" id="pf-price" value="${p.Price || ''}"></div>
      <div class="ibl-form-group"><label>Discount Price (₹)</label><input type="number" id="pf-dprice" value="${p.DiscountPrice || ''}"></div>
    </div>
    <div class="grid-2">
      <div class="ibl-form-group"><label>Stock *</label><input type="number" id="pf-stock" value="${p.Stock != null ? p.Stock : ''}"></div>
      <div class="ibl-form-group"><label>Unit</label><input id="pf-unit" value="${escapeHtml(p.Unit || 'pc')}" placeholder="pc, kg, ltr"></div>
    </div>
    <div class="grid-2">
      <div class="ibl-form-group"><label>SKU</label><input id="pf-sku" value="${escapeHtml(p.SKU || '')}"></div>
      <div class="ibl-form-group"><label>Brand</label><input id="pf-brand" value="${escapeHtml(p.Brand || '')}"></div>
    </div>
    ${imageUploadHtml('pf-image', p.Image)}
    <div class="ibl-form-group"><label>Tags</label><input id="pf-tags" value="${escapeHtml(p.Tags || '')}" placeholder="comma separated"></div>
    <div class="ibl-form-group"><label>Subcategory</label><input id="pf-subcat" value="${escapeHtml(p.Subcategory || '')}"></div>
    <button class="ibl-btn ibl-btn--primary ibl-btn--full mt-8" onclick="${p.ProductID ? `saveEditProduct('${p.ProductID}')` : 'saveNewProduct()'}">${p.ProductID ? 'Save Changes' : 'Add Product'}</button>`;
}

async function saveNewProduct() {
  const data = getProductFormData();
  if (!data.name || !data.price) { showToast('Name and price are required.', 'error'); return; }
  showLoading();
  const res = await API.post('addProduct', data);
  hideLoading();
  if (res.success) { showToast('Product added!', 'success'); closeModal(); renderMerchantProducts(); }
  else showToast(res.message, 'error');
}

async function showEditProductModal(productId) {
  showLoading();
  const res = await API.get('getProduct', { productId });
  hideLoading();
  if (!res.success) { showToast('Product not found.', 'error'); return; }
  showModal('Edit Product', productFormHtml(res.data.product), null, true);
}

async function saveEditProduct(productId) {
  const data = getProductFormData();
  data.productId = productId;
  showLoading();
  const res = await API.post('updateProduct', data);
  hideLoading();
  if (res.success) { showToast('Product updated!', 'success'); closeModal(); renderMerchantProducts(); }
  else showToast(res.message, 'error');
}

function getProductFormData() {
  return {
    name: document.getElementById('pf-name').value.trim(),
    description: document.getElementById('pf-desc').value.trim(),
    category: document.getElementById('pf-category').value.trim(),
    subcategory: document.getElementById('pf-subcat').value.trim(),
    price: document.getElementById('pf-price').value,
    discountPrice: document.getElementById('pf-dprice').value,
    stock: document.getElementById('pf-stock').value,
    unit: document.getElementById('pf-unit').value.trim(),
    sku: document.getElementById('pf-sku').value.trim(),
    brand: document.getElementById('pf-brand').value.trim(),
    image: document.getElementById('pf-image').value.trim(),
    tags: document.getElementById('pf-tags').value.trim()
  };
}

async function toggleProductActive(productId) {
  const res = await API.post('toggleProduct', { productId });
  if (res.success) { showToast(res.data.active ? 'Product enabled.' : 'Product disabled.', 'info'); renderMerchantProducts(); }
  else showToast(res.message, 'error');
}

async function deleteMerchantProduct(productId) {
  if (!confirm('Delete this product permanently?')) return;
  const res = await API.post('deleteProduct', { productId });
  if (res.success) { showToast('Product deleted.', 'info'); renderMerchantProducts(); }
  else showToast(res.message, 'error');
}

// ── MERCHANT SHOP ──
async function renderMerchantShop() {
  const mc = document.getElementById('main-content');
  mc.innerHTML = `${merchantSidebar('merchant/shop')}<div class="ibl-panel__content">${renderSkeleton('loading')}</div>${merchantMobileNav('merchant/shop')}`;
  const res = await API.get('getMerchantShop');
  const content = mc.querySelector('.ibl-panel__content');
  if (!res.success) { content.innerHTML = `<p class="text-muted">${escapeHtml(res.message)}</p>`; return; }
  const merchant = res.data.merchant;
  const shop = res.data.shop;

  if (merchant.Status !== 'approved') {
    content.innerHTML = `<div class="ibl-empty"><div class="ibl-empty__icon"><i class="fas fa-clock"></i></div>
      <h3>Merchant Account: ${escapeHtml(merchant.Status)}</h3>
      <p>Your merchant application is currently <strong>${escapeHtml(merchant.Status)}</strong>. ${merchant.Status === 'pending' ? 'Please wait for admin approval before creating a shop.' : ''}</p></div>`;
    return;
  }

  if (!shop) {
    content.innerHTML = `<h2 class="ibl-panel__page-title">Create Your Shop</h2>
      ${shopFormHtml()}`;
    return;
  }

  content.innerHTML = `<h2 class="ibl-panel__page-title">My Shop</h2>
    <div class="ibl-card" style="padding:0;margin-bottom:24px">
      <div style="height:180px;${bgImg(shop.ShopImage, shop.ShopName)};background-size:cover;background-position:center;position:relative">
        <div style="position:absolute;top:12px;right:12px">${statusBadge(shop.Approved)}</div>
      </div>
      <div style="padding:18px">
        <div class="flex justify-between items-center mb-8">
          <h2>${escapeHtml(shop.ShopName)}</h2>
          ${statusBadge(shop.ShopStatus)}
        </div>
        <p class="text-muted mb-8">${escapeHtml(shop.Description || '')}</p>
        <div class="flex gap-12 flex-wrap text-muted" style="font-size:.85rem">
          <span><i class="fas fa-map-marker-alt" style="color:var(--c-primary)"></i> ${escapeHtml(shop.Address)}</span>
          <span><i class="fas fa-clock"></i> ${shop.OpeningTime}–${shop.ClosingTime}</span>
          <span><i class="fas fa-motorcycle"></i> ${formatPrice(shop.DeliveryFee)}</span>
          <span>Min ${formatPrice(shop.MinOrder)}</span>
          <span>⭐ ${shop.Rating} (${shop.RatingCount})</span>
        </div>
        <div class="flex gap-8 mt-16">
          <button class="ibl-btn ibl-btn--primary ibl-btn--sm" onclick="showEditShopModal()"><i class="fas fa-edit"></i> Edit Shop</button>
          <button class="ibl-btn ibl-btn--secondary ibl-btn--sm" onclick="toggleShopStatusAction()"><i class="fas ${shop.ShopStatus === 'open' ? 'fa-pause' : 'fa-play'}"></i> ${shop.ShopStatus === 'open' ? 'Pause' : 'Open'} Shop</button>
        </div>
      </div>
    </div>`;
}

function shopFormHtml(s) {
  s = s || {};
  const isEdit = !!s.ShopID;
  return `<div class="ibl-card" style="padding:24px;max-width:640px">
    <div class="grid-2">
      <div class="ibl-form-group"><label>Shop Name *</label><input id="sf-name" value="${escapeHtml(s.ShopName || '')}"></div>
      <div class="ibl-form-group"><label>Category</label><input id="sf-category" value="${escapeHtml(s.Category || '')}" placeholder="e.g. Groceries"></div>
    </div>
    <div class="ibl-form-group"><label>Description</label><textarea id="sf-desc" rows="2">${escapeHtml(s.Description || '')}</textarea></div>
    <div class="ibl-form-group"><label>Address</label><input id="sf-address" value="${escapeHtml(s.Address || '')}"></div>
    <div class="grid-2">
      <div class="ibl-form-group"><label>Latitude *</label><input id="sf-lat" value="${s.Latitude || ''}" placeholder="11.0168"></div>
      <div class="ibl-form-group"><label>Longitude *</label><input id="sf-lng" value="${s.Longitude || ''}" placeholder="76.9558"></div>
    </div>
    <button class="ibl-btn ibl-btn--ghost ibl-btn--sm mb-16" onclick="getShopLocation()"><i class="fas fa-crosshairs"></i> Use current location</button>
    <div class="grid-2">
      <div class="ibl-form-group"><label>Opening Time</label><input type="time" id="sf-open" value="${s.OpeningTime || '09:00'}"></div>
      <div class="ibl-form-group"><label>Closing Time</label><input type="time" id="sf-close" value="${s.ClosingTime || '21:00'}"></div>
    </div>
    <div class="grid-2">
      <div class="ibl-form-group"><label>Min Order (₹)</label><input type="number" id="sf-min" value="${s.MinOrder || 0}"></div>
      <div class="ibl-form-group"><label>Delivery Fee (₹)</label><input type="number" id="sf-fee" value="${s.DeliveryFee || 30}"></div>
    </div>
    <div class="grid-2">
      <div class="ibl-form-group"><label>Delivery Radius (km)</label><input type="number" id="sf-radius" value="${s.DeliveryRadiusKm || 5}"></div>
      <div></div>
    </div>
    ${imageUploadHtml('sf-image', s.ShopImage)}
    <button class="ibl-btn ibl-btn--primary ibl-btn--full mt-8" onclick="${isEdit ? 'saveShopEdit()' : 'createShopAction()'}">
      ${isEdit ? 'Save Changes' : 'Create Shop'}</button>
  </div>`;
}

function getShopLocation() {
  if (!navigator.geolocation) { showToast('Geolocation not supported.', 'error'); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    document.getElementById('sf-lat').value = pos.coords.latitude.toFixed(4);
    document.getElementById('sf-lng').value = pos.coords.longitude.toFixed(4);
    showToast('Location captured!', 'success');
  }, () => showToast('Location denied.', 'error'));
}

async function createShopAction() {
  const data = getShopFormData();
  if (!data.shopName || !data.latitude || !data.longitude) { showToast('Shop name and location are required.', 'error'); return; }
  showLoading();
  const res = await API.post('createShop', data);
  hideLoading();
  if (res.success) { showToast('Shop created!', 'success'); renderMerchantShop(); }
  else showToast(res.message, 'error');
}

async function showEditShopModal() {
  const res = await API.get('getMerchantShop');
  if (!res.success || !res.data.shop) { showToast('Shop not found.', 'error'); return; }
  showModal('Edit Shop', shopFormHtml(res.data.shop), null, true);
}

async function saveShopEdit() {
  const data = getShopFormData();
  showLoading();
  const res = await API.post('updateShop', data);
  hideLoading();
  if (res.success) { showToast('Shop updated!', 'success'); closeModal(); renderMerchantShop(); }
  else showToast(res.message, 'error');
}

function getShopFormData() {
  return {
    shopName: document.getElementById('sf-name').value.trim(),
    category: document.getElementById('sf-category').value.trim(),
    description: document.getElementById('sf-desc').value.trim(),
    address: document.getElementById('sf-address').value.trim(),
    latitude: document.getElementById('sf-lat').value,
    longitude: document.getElementById('sf-lng').value,
    openingTime: document.getElementById('sf-open').value,
    closingTime: document.getElementById('sf-close').value,
    minOrder: document.getElementById('sf-min').value,
    deliveryFee: document.getElementById('sf-fee').value,
    deliveryRadiusKm: document.getElementById('sf-radius').value,
    shopImage: document.getElementById('sf-image').value.trim()
  };
}

async function toggleShopStatusAction() {
  showLoading();
  const res = await API.post('toggleShopStatus');
  hideLoading();
  if (res.success) { showToast('Shop is now ' + res.data.status + '.', 'success'); renderMerchantShop(); }
  else showToast(res.message, 'error');
}

    }).join('')}</tbody></table></div>`;
}

function showAddCouponModal() {
  showModal('Add Coupon', `
    <div class="grid-2">
      <div class="ibl-form-group"><label>Code</label><input id="cpn-code" placeholder="e.g. SAVE20" style="text-transform:uppercase"></div>
      <div class="ibl-form-group"><label>Type</label><select id="cpn-type"><option value="percentage">Percentage</option><option value="flat">Flat</option></select></div>
    </div>
    <div class="grid-2">
      <div class="ibl-form-group"><label>Value</label><input type="number" id="cpn-value" placeholder="e.g. 20"></div>
      <div class="ibl-form-group"><label>Min Order (₹)</label><input type="number" id="cpn-min" placeholder="0"></div>
    </div>
    <div class="grid-2">
      <div class="ibl-form-group"><label>Max Discount (₹)</label><input type="number" id="cpn-max" placeholder="0"></div>
      <div class="ibl-form-group"><label>Usage Limit</label><input type="number" id="cpn-limit" placeholder="0 = unlimited"></div>
    </div>
    <div class="grid-2">
      <div class="ibl-form-group"><label>Start Date</label><input type="date" id="cpn-start"></div>
      <div class="ibl-form-group"><label>Expiry Date</label><input type="date" id="cpn-end"></div>
    </div>
    <button class="ibl-btn ibl-btn--primary ibl-btn--full mt-8" onclick="addCouponAction()">Create Coupon</button>`, null, true);
}

async function addCouponAction() {
  const data = {
    op: 'add',
    code: document.getElementById('cpn-code').value.trim(),
    type: document.getElementById('cpn-type').value,
    value: document.getElementById('cpn-value').value,
    minOrder: document.getElementById('cpn-min').value,
    maxDiscount: document.getElementById('cpn-max').value,
    usageLimit: document.getElementById('cpn-limit').value,
    startDate: document.getElementById('cpn-start').value,
    expiryDate: document.getElementById('cpn-end').value
  };
  if (!data.code || !data.value) { showToast('Code and value are required.', 'error'); return; }
  showLoading();
  const res = await API.post('adminManageCoupon', data);
  hideLoading();
  if (res.success) { showToast('Coupon created!', 'success'); closeModal(); renderAdminCoupons(); }
  else showToast(res.message, 'error');
}

async function toggleCoupon(couponId) {
  const res = await API.post('adminManageCoupon', { op: 'toggle', couponId });
  if (res.success) { showToast('Coupon updated.', 'info'); renderAdminCoupons(); }
  else showToast(res.message, 'error');
}

async function deleteCoupon(couponId) {
  if (!confirm('Delete this coupon?')) return;
  const res = await API.post('adminManageCoupon', { op: 'delete', couponId });
  if (res.success) { showToast('Coupon deleted.', 'info'); renderAdminCoupons(); }
  else showToast(res.message, 'error');
}

// ── ADMIN REPORTS ──
async function renderAdminReports() {
  const mc = document.getElementById('main-content');
  mc.innerHTML = `${adminSidebar('admin/reports')}<div class="ibl-panel__content">
    <h2 class="ibl-panel__page-title">Reports</h2>${renderSkeleton('loading')}</div>`;
  const res = await API.get('adminReports');
  const content = mc.querySelector('.ibl-panel__content');
  if (!res.success) { content.innerHTML = `<h2 class="ibl-panel__page-title">Reports</h2><p class="text-muted">${escapeHtml(res.message)}</p>`; return; }
  const d = res.data;

  let chartHtml = '';
  if (d.salesByDay && d.salesByDay.length) {
    const max = Math.max(...d.salesByDay.map(s => s.sales), 1);
    chartHtml = `<div class="ibl-card" style="padding:20px;margin-bottom:24px"><h3 style="margin-bottom:16px">Sales by Day</h3>
      <div style="display:flex;align-items:flex-end;gap:4px;height:180px;padding-bottom:24px;position:relative">
        ${d.salesByDay.slice(-14).map(s => {
          const h = Math.max(4, (s.sales / max) * 150);
          return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
            <span style="font-size:.6rem;color:var(--c-muted)">${formatPrice(s.sales)}</span>
            <div style="width:100%;height:${h}px;background:var(--grad-orange);border-radius:4px 4px 0 0;min-width:20px"></div>
            <span style="font-size:.55rem;color:var(--c-muted);transform:rotate(-45deg);white-space:nowrap">${s.date.slice(5)}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }

  content.innerHTML = `<h2 class="ibl-panel__page-title">Reports</h2>
    <div class="ibl-stats-grid mb-24">
      ${statCard('fa-users', 'info', d.totalCustomers, 'Total Customers')}
      ${statCard('fa-user-tie', 'purple', d.totalMerchants, 'Total Merchants')}
    </div>
    ${chartHtml}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
      <div class="ibl-card" style="padding:20px"><h3 style="margin-bottom:12px">Top Products</h3>
        ${(d.topProducts || []).map((p, i) => `<div class="flex justify-between items-center mb-8" style="font-size:.85rem">
          <span><span style="color:var(--c-muted);margin-right:6px">${i + 1}.</span>${escapeHtml(p.name)}</span><span style="font-weight:600">${p.unitsSold} sold</span></div>`).join('')}
      </div>
      <div class="ibl-card" style="padding:20px"><h3 style="margin-bottom:12px">Top Shops</h3>
        ${(d.topShops || []).map((s, i) => `<div class="flex justify-between items-center mb-8" style="font-size:.85rem">
          <span><span style="color:var(--c-muted);margin-right:6px">${i + 1}.</span>${escapeHtml(s.name)}</span><span style="font-weight:600">${formatPrice(s.revenue)}</span></div>`).join('')}
      </div>
    </div>`;
  if (window.innerWidth <= 768) {
    const grid = content.querySelector('[style*="grid-template-columns: 1fr 1fr"]') || content.querySelector('[style*="grid-template-columns:1fr 1fr"]');
    if (grid) grid.style.gridTemplateColumns = '1fr';
  }
}

// =====================================================================
// APP INITIALIZATION
// =====================================================================
async function initApp() {
  updateLocationUI();
  updateUserUI();

  // Try restore session
  const restored = await restoreSession();
  if (restored) {
    loadCartAndWishlist();
    // Load notification count
    const nRes = await API.get('getNotifications');
    if (nRes.success) {
      STATE.notificationCount = (nRes.data.notifications || []).filter(n => !n.Read && n.Read !== 'TRUE').length;
      updateNotifBadge();
    }
  }

  // Show app
  document.getElementById('app').classList.remove('hidden');

  // Check if location is needed
  if (!STATE.location) {
    showLocationModal();
  }

  // Listen for hash changes
  window.addEventListener('hashchange', handleRoute);

  // Initial route
  if (!window.location.hash || window.location.hash === '#/') {
    if (STATE.user && STATE.user.role === 'admin') window.location.hash = '#/admin';
    else if (STATE.user && STATE.user.role === 'merchant') window.location.hash = '#/merchant';
    else window.location.hash = '#/home';
  }
  handleRoute();
}

// Wait for DOM
document.addEventListener('DOMContentLoaded', initApp);

</script>
