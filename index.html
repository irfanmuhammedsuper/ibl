<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="description" content="IBL — Local Shops. Local Products. Delivered. Your hyper-local marketplace.">
<meta name="theme-color" content="#FF7A00">
<title>IBL — Local Shops. Local Products. Delivered.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--c-primary:#FF7A00;--c-primary-light:#FFA54F;--c-primary-dark:#E06800;
--c-secondary:#7B2CBF;--c-secondary-light:#9D4EDD;
--c-deep-orange:#F4511E;--c-white:#FFFFFF;--c-bg:#FFF8F2;
--c-dark:#171717;--c-text:#1F2937;--c-muted:#6B7280;--c-border:#E5E7EB;
--c-success:#16A34A;--c-danger:#DC2626;--c-warning:#F59E0B;--c-info:#3B82F6;
--c-card:#FFFFFF;--c-surface:#F9FAFB;
--grad-brand:linear-gradient(135deg,#FF7A00,#7B2CBF);
--grad-orange:linear-gradient(135deg,#FF7A00,#F4511E);
--grad-warm:linear-gradient(135deg,#FF7A00 0%,#F4511E 50%,#7B2CBF 100%);
--shadow-sm:0 1px 3px rgba(0,0,0,0.06);--shadow-md:0 4px 16px rgba(0,0,0,0.1);
--shadow-lg:0 8px 32px rgba(0,0,0,0.12);--shadow-xl:0 16px 48px rgba(0,0,0,0.16);
--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:24px;--radius-full:9999px;
--font-body:'Inter',system-ui,sans-serif;--font-heading:'Plus Jakarta Sans','Inter',sans-serif;
--header-h:64px;--bottom-nav-h:68px;
--z-header:100;--z-modal:200;--z-toast:300;--z-loading:400;
}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:var(--font-body);background:var(--c-bg);color:var(--c-text);line-height:1.6;
-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden}
h1,h2,h3,h4,h5,h6{font-family:var(--font-heading);font-weight:700;line-height:1.2;letter-spacing:-0.02em}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:1rem;border:1.5px solid var(--c-border);
border-radius:var(--radius-sm);padding:12px 16px;outline:none;transition:border-color .2s,box-shadow .2s;
background:var(--c-white);color:var(--c-text);width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--c-primary);box-shadow:0 0 0 3px rgba(255,122,0,0.15)}
img{max-width:100%;display:block}
ul{list-style:none}

/* SCROLLBAR */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.15);border-radius:3px}

/* BUTTONS */
.ibl-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;
border-radius:var(--radius-sm);font-weight:600;font-size:.9rem;transition:all .25s ease;
letter-spacing:0.01em;position:relative;overflow:hidden}
.ibl-btn--primary{background:var(--grad-orange);color:#fff;box-shadow:0 4px 14px rgba(255,122,0,0.35)}
.ibl-btn--primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,122,0,0.45)}
.ibl-btn--primary:active{transform:translateY(0)}
.ibl-btn--secondary{background:var(--c-white);color:var(--c-primary);border:2px solid var(--c-primary)}
.ibl-btn--secondary:hover{background:var(--c-primary);color:#fff}
.ibl-btn--ghost{background:transparent;color:var(--c-text)}
.ibl-btn--ghost:hover{background:rgba(0,0,0,0.05)}
.ibl-btn--danger{background:var(--c-danger);color:#fff}
.ibl-btn--danger:hover{background:#b91c1c}
.ibl-btn--success{background:var(--c-success);color:#fff}
.ibl-btn--success:hover{background:#15803d}
.ibl-btn--sm{padding:8px 16px;font-size:.8rem}
.ibl-btn--lg{padding:14px 32px;font-size:1rem}
.ibl-btn--full{width:100%}
.ibl-btn--round{border-radius:var(--radius-full)}
.ibl-btn--icon{width:40px;height:40px;padding:0;border-radius:50%}
.ibl-btn[disabled]{opacity:.5;pointer-events:none}
.ibl-btn .spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}

/* CARDS */
.ibl-card{background:var(--c-card);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);
overflow:hidden;transition:transform .25s,box-shadow .25s}
.ibl-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.ibl-card--glass{background:rgba(255,255,255,0.8);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.4)}
.ibl-card--flat{box-shadow:none;border:1px solid var(--c-border)}
.ibl-card--flat:hover{transform:none;box-shadow:none;border-color:var(--c-primary)}

/* BADGES */
.ibl-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:var(--radius-full);font-size:.75rem;font-weight:600}
.ibl-badge--success{background:#DCFCE7;color:#15803D}
.ibl-badge--danger{background:#FEE2E2;color:#DC2626}
.ibl-badge--warning{background:#FEF3C7;color:#D97706}
.ibl-badge--info{background:#DBEAFE;color:#2563EB}
.ibl-badge--primary{background:#FFF0E0;color:#E06800}
.ibl-badge--purple{background:#F3E8FF;color:#7B2CBF}

/* FORM */
.ibl-form-group{margin-bottom:16px}
.ibl-form-group label{display:block;font-size:.85rem;font-weight:600;color:var(--c-text);margin-bottom:6px}
.ibl-form-group .ibl-input-wrap{position:relative}
.ibl-form-group .ibl-input-wrap i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--c-muted);font-size:.9rem}
.ibl-form-group .ibl-input-wrap input{padding-left:40px}
.ibl-form-group .ibl-input-icon-right{position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--c-muted)}
.ibl-form-error{color:var(--c-danger);font-size:.8rem;margin-top:4px}

/* HEADER */
.ibl-header{position:fixed;top:0;left:0;right:0;height:var(--header-h);background:rgba(255,255,255,0.92);
backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,0,0,0.06);
z-index:var(--z-header);display:flex;align-items:center;padding:0 20px;gap:12px}
.ibl-header__logo{font-family:var(--font-heading);font-size:1.6rem;font-weight:800;
background:var(--grad-brand);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
background-clip:text;flex-shrink:0;cursor:pointer}
.ibl-header__location{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius-full);
background:var(--c-bg);cursor:pointer;font-size:.85rem;color:var(--c-text);max-width:200px;transition:background .2s}
.ibl-header__location:hover{background:#FFE8D0}
.ibl-header__location i{color:var(--c-primary);font-size:.9rem}
.ibl-header__location span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ibl-header__search{flex:1;max-width:520px;position:relative}
.ibl-header__search input{width:100%;padding:10px 16px 10px 42px;border-radius:var(--radius-full);
border:1.5px solid var(--c-border);background:var(--c-surface);font-size:.9rem}
.ibl-header__search input:focus{border-color:var(--c-primary);background:#fff}
.ibl-header__search i.fa-search{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--c-muted)}
.ibl-header__actions{display:flex;align-items:center;gap:4px;margin-left:auto}
.ibl-header__action-btn{position:relative;width:42px;height:42px;border-radius:50%;display:flex;
align-items:center;justify-content:center;color:var(--c-text);transition:background .2s;font-size:1.1rem}
.ibl-header__action-btn:hover{background:var(--c-bg)}
.ibl-header__action-btn .badge-count{position:absolute;top:2px;right:2px;min-width:18px;height:18px;
border-radius:9px;background:var(--c-danger);color:#fff;font-size:.65rem;font-weight:700;
display:flex;align-items:center;justify-content:center;padding:0 4px}
.ibl-header__user-btn{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:var(--radius-full);
background:var(--c-bg);cursor:pointer;font-size:.85rem;font-weight:600;transition:background .2s}
.ibl-header__user-btn:hover{background:#FFE8D0}
.ibl-header__user-btn .avatar{width:30px;height:30px;border-radius:50%;background:var(--grad-brand);
color:#fff;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}

/* BOTTOM NAV */
.ibl-bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:var(--bottom-nav-h);
background:rgba(255,255,255,0.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
border-top:1px solid rgba(0,0,0,0.06);z-index:var(--z-header);padding:0 8px;padding-bottom:env(safe-area-inset-bottom)}
.ibl-bottom-nav__inner{display:flex;align-items:center;justify-content:space-around;height:100%}
.ibl-bottom-nav__item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 12px;
border-radius:var(--radius-sm);color:var(--c-muted);font-size:.65rem;font-weight:600;transition:color .2s;
position:relative;cursor:pointer}
.ibl-bottom-nav__item i{font-size:1.2rem;transition:transform .2s}
.ibl-bottom-nav__item--active{color:var(--c-primary)}
.ibl-bottom-nav__item--active i{transform:scale(1.1)}
.ibl-bottom-nav__item .badge-count{position:absolute;top:0;right:4px;min-width:16px;height:16px;
border-radius:8px;background:var(--c-danger);color:#fff;font-size:.6rem;font-weight:700;
display:flex;align-items:center;justify-content:center;padding:0 3px}

/* MAIN CONTENT */
.ibl-main{padding-top:var(--header-h);min-height:100vh}
.ibl-container{max-width:1280px;margin:0 auto;padding:0 20px}

/* AUTH SCREENS */
.ibl-auth{min-height:100vh;display:flex;position:fixed;inset:0;z-index:150;background:var(--c-bg)}
.ibl-auth__left{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;
padding:40px;background:var(--c-white)}
.ibl-auth__right{flex:1;background:var(--grad-warm);display:flex;flex-direction:column;
justify-content:center;align-items:center;padding:60px;color:#fff;position:relative;overflow:hidden}
.ibl-auth__right::before{content:'';position:absolute;width:400px;height:400px;border-radius:50%;
background:rgba(255,255,255,0.08);top:-100px;right:-100px}
.ibl-auth__right::after{content:'';position:absolute;width:300px;height:300px;border-radius:50%;
background:rgba(255,255,255,0.05);bottom:-80px;left:-60px}
.ibl-auth__form{width:100%;max-width:420px}
.ibl-auth__form h1{font-size:1.8rem;margin-bottom:6px;color:var(--c-dark)}
.ibl-auth__form p.subtitle{color:var(--c-muted);margin-bottom:28px;font-size:.95rem}
.ibl-auth__right h2{font-size:2.4rem;font-family:var(--font-heading);margin-bottom:12px;position:relative;z-index:1}
.ibl-auth__right p{font-size:1.1rem;opacity:.9;max-width:400px;text-align:center;position:relative;z-index:1}
.ibl-auth__divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--c-muted);font-size:.85rem}
.ibl-auth__divider::before,.ibl-auth__divider::after{content:'';flex:1;height:1px;background:var(--c-border)}
.ibl-auth__footer{text-align:center;margin-top:20px;font-size:.9rem;color:var(--c-muted)}
.ibl-auth__footer a{color:var(--c-primary);font-weight:600;cursor:pointer}
.ibl-auth__footer a:hover{text-decoration:underline}
.ibl-auth__tabs{display:flex;gap:0;margin-bottom:24px;border-radius:var(--radius-sm);overflow:hidden;border:1.5px solid var(--c-border)}
.ibl-auth__tab{flex:1;padding:10px;text-align:center;font-weight:600;font-size:.9rem;cursor:pointer;
transition:all .2s;color:var(--c-muted)}
.ibl-auth__tab--active{background:var(--c-primary);color:#fff}

/* HERO */
.ibl-hero{padding:48px 0 32px;position:relative;overflow:hidden}
.ibl-hero__content{max-width:560px}
.ibl-hero__tag{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:var(--radius-full);
background:rgba(255,122,0,0.1);color:var(--c-primary);font-size:.8rem;font-weight:600;margin-bottom:16px}
.ibl-hero h1{font-size:2.6rem;line-height:1.15;margin-bottom:14px;color:var(--c-dark);letter-spacing:-0.03em}
.ibl-hero h1 span{background:var(--grad-brand);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.ibl-hero p{font-size:1.1rem;color:var(--c-muted);margin-bottom:28px;max-width:440px;line-height:1.7}
.ibl-hero__actions{display:flex;gap:12px;flex-wrap:wrap}
.ibl-hero__animation{position:absolute;right:40px;top:50%;transform:translateY(-50%);width:420px}

/* DELIVERY ANIMATION */
.ibl-rider-anim{position:relative;width:100%;height:200px}
.ibl-rider-anim__road{position:absolute;bottom:40px;left:0;right:0;height:3px;background:var(--c-border);border-radius:2px}
.ibl-rider-anim__road::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;
background:repeating-linear-gradient(90deg,var(--c-border) 0,var(--c-border) 12px,transparent 12px,transparent 24px)}
.ibl-rider-anim__shop{position:absolute;bottom:46px;left:8%;display:flex;flex-direction:column;align-items:center}
.ibl-rider-anim__shop i{font-size:1.6rem;color:var(--c-primary)}
.ibl-rider-anim__shop span{font-size:.65rem;font-weight:600;color:var(--c-muted);margin-top:2px}
.ibl-rider-anim__dest{position:absolute;bottom:46px;right:8%;display:flex;flex-direction:column;align-items:center}
.ibl-rider-anim__dest i{font-size:1.6rem;color:var(--c-success)}
.ibl-rider-anim__dest span{font-size:.65rem;font-weight:600;color:var(--c-muted);margin-top:2px}
.ibl-rider-anim__dest::after{content:'';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);
width:24px;height:24px;border-radius:50%;background:rgba(22,163,74,0.15);animation:pulse-ring 1.5s ease infinite}
.ibl-rider-anim__rider{position:absolute;bottom:44px;animation:ride 4s ease-in-out infinite}
.ibl-rider-anim__scooter{font-size:2rem;color:var(--c-primary);position:relative}
.ibl-rider-anim__scooter::before{content:'📦';position:absolute;top:-18px;left:50%;transform:translateX(-50%);
font-size:.9rem;animation:float-pkg 1s ease-in-out infinite}
@keyframes ride{0%{left:14%}50%{left:68%}100%{left:14%}}
@keyframes float-pkg{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-4px)}}
@keyframes pulse-ring{0%{transform:translateX(-50%) scale(1);opacity:.6}100%{transform:translateX(-50%) scale(2.2);opacity:0}}

/* CATEGORIES */
.ibl-categories{padding:20px 0}
.ibl-categories__scroll{display:flex;gap:14px;overflow-x:auto;padding:8px 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.ibl-categories__scroll::-webkit-scrollbar{display:none}
.ibl-categories__item{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 12px;
min-width:80px;border-radius:var(--radius-md);background:var(--c-white);cursor:pointer;transition:all .25s;
border:1.5px solid transparent;box-shadow:var(--shadow-sm)}
.ibl-categories__item:hover,.ibl-categories__item--active{border-color:var(--c-primary);transform:translateY(-3px);box-shadow:var(--shadow-md)}
.ibl-categories__item i{font-size:1.4rem;color:var(--c-primary);width:44px;height:44px;
display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,122,0,0.1)}
.ibl-categories__item span{font-size:.75rem;font-weight:600;color:var(--c-text);text-align:center;white-space:nowrap}

/* SECTION HEADERS */
.ibl-section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding:0 4px}
.ibl-section-header h2{font-size:1.3rem;color:var(--c-dark)}
.ibl-section-header a{color:var(--c-primary);font-size:.85rem;font-weight:600;cursor:pointer}

/* SHOP CARDS */
.ibl-shop-card{display:flex;flex-direction:column;border-radius:var(--radius-lg);overflow:hidden;
background:var(--c-white);box-shadow:var(--shadow-sm);transition:all .25s;cursor:pointer}
.ibl-shop-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-md)}
.ibl-shop-card__img{height:160px;background-size:cover;background-position:center;position:relative}
.ibl-shop-card__img .status-dot{position:absolute;top:12px;right:12px;padding:4px 10px;border-radius:var(--radius-full);
font-size:.7rem;font-weight:700;display:flex;align-items:center;gap:4px}
.ibl-shop-card__img .status-dot--open{background:rgba(22,163,74,0.9);color:#fff}
.ibl-shop-card__img .status-dot--closed{background:rgba(220,38,38,0.9);color:#fff}
.ibl-shop-card__body{padding:14px}
.ibl-shop-card__name{font-weight:700;font-size:1rem;margin-bottom:4px}
.ibl-shop-card__meta{display:flex;align-items:center;gap:12px;font-size:.8rem;color:var(--c-muted);flex-wrap:wrap}
.ibl-shop-card__meta i{color:var(--c-primary)}
.ibl-shop-card__category{font-size:.75rem;color:var(--c-primary);font-weight:600;margin-bottom:6px}

/* PRODUCT CARDS */
.ibl-products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.ibl-product-card{position:relative;border-radius:var(--radius-lg);overflow:hidden;background:var(--c-white);
box-shadow:var(--shadow-sm);transition:all .3s;display:flex;flex-direction:column}
.ibl-product-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-md)}
.ibl-product-card__img{height:180px;background-size:cover;background-position:center;position:relative}
.ibl-product-card__discount{position:absolute;top:10px;left:10px;padding:3px 8px;border-radius:var(--radius-sm);
background:var(--c-danger);color:#fff;font-size:.7rem;font-weight:700}
.ibl-product-card__wishlist{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;
background:rgba(255,255,255,0.9);display:flex;align-items:center;justify-content:center;cursor:pointer;
transition:all .2s;font-size:.9rem;color:var(--c-muted);backdrop-filter:blur(4px)}
.ibl-product-card__wishlist:hover,.ibl-product-card__wishlist--active{color:var(--c-danger);background:#fff}
.ibl-product-card__body{padding:12px;flex:1;display:flex;flex-direction:column}
.ibl-product-card__name{font-weight:600;font-size:.9rem;margin-bottom:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ibl-product-card__shop{font-size:.75rem;color:var(--c-muted);margin-bottom:4px}
.ibl-product-card__rating{display:flex;align-items:center;gap:4px;font-size:.75rem;color:var(--c-muted);margin-bottom:8px}
.ibl-product-card__rating .stars{color:#F59E0B}
.ibl-product-card__price{display:flex;align-items:baseline;gap:6px;margin-top:auto;margin-bottom:8px}
.ibl-product-card__price .current{font-size:1.05rem;font-weight:700;color:var(--c-dark)}
.ibl-product-card__price .original{font-size:.8rem;color:var(--c-muted);text-decoration:line-through}
.ibl-product-card__add{width:100%;padding:8px;border-radius:var(--radius-sm);background:var(--c-primary);
color:#fff;font-weight:600;font-size:.85rem;border:none;cursor:pointer;transition:background .2s}
.ibl-product-card__add:hover{background:var(--c-primary-dark)}

/* PRODUCT DETAIL */
.ibl-product-detail{padding:24px 0}
.ibl-product-detail__grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
.ibl-product-detail__image{border-radius:var(--radius-lg);overflow:hidden;position:relative}
.ibl-product-detail__image img{width:100%;height:420px;object-fit:cover}
.ibl-product-detail__info h1{font-size:1.8rem;margin-bottom:6px}
.ibl-product-detail__brand{color:var(--c-primary);font-weight:600;font-size:.9rem;margin-bottom:8px}
.ibl-product-detail__rating{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:.9rem}
.ibl-product-detail__price{display:flex;align-items:baseline;gap:10px;margin-bottom:20px}
.ibl-product-detail__price .current{font-size:2rem;font-weight:800;color:var(--c-dark)}
.ibl-product-detail__price .original{font-size:1.1rem;color:var(--c-muted);text-decoration:line-through}
.ibl-product-detail__price .discount-pct{font-size:.9rem;font-weight:700;color:var(--c-success)}
.ibl-product-detail__desc{margin-bottom:20px;color:var(--c-muted);line-height:1.8}
.ibl-product-detail__actions{display:flex;gap:12px;margin-bottom:24px}
.ibl-product-detail__qty{display:flex;align-items:center;gap:0;border:1.5px solid var(--c-border);border-radius:var(--radius-sm);overflow:hidden}
.ibl-product-detail__qty button{width:40px;height:40px;font-size:1.1rem;color:var(--c-text);transition:background .2s}
.ibl-product-detail__qty button:hover{background:var(--c-bg)}
.ibl-product-detail__qty span{width:48px;text-align:center;font-weight:600}
.ibl-product-detail__meta{display:flex;flex-direction:column;gap:8px;padding:16px;background:var(--c-surface);border-radius:var(--radius-md)}
.ibl-product-detail__meta-row{display:flex;justify-content:space-between;font-size:.85rem}
.ibl-product-detail__meta-row .label{color:var(--c-muted)}
.ibl-product-detail__meta-row .value{font-weight:600}

/* SHOP PAGE */
.ibl-shop-hero{position:relative;height:220px;background-size:cover;background-position:center;border-radius:var(--radius-lg);margin-bottom:24px;overflow:hidden}
.ibl-shop-hero__overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,0.7));display:flex;align-items:flex-end;padding:20px}
.ibl-shop-hero__info{color:#fff}
.ibl-shop-hero__info h1{font-size:1.6rem;margin-bottom:4px}
.ibl-shop-hero__info .meta{display:flex;gap:14px;font-size:.85rem;opacity:.9;flex-wrap:wrap}

/* CART */
.ibl-cart{padding:24px 0}
.ibl-cart__group{margin-bottom:20px}
.ibl-cart__group-header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--c-white);
border-radius:var(--radius-md) var(--radius-md) 0 0;border-bottom:1px solid var(--c-border)}
.ibl-cart__group-header h3{font-size:1rem;flex:1}
.ibl-cart__item{display:flex;gap:12px;padding:14px 16px;background:var(--c-white);border-bottom:1px solid var(--c-border);align-items:center}
.ibl-cart__item:last-child{border-bottom:none;border-radius:0 0 var(--radius-md) var(--radius-md)}
.ibl-cart__item-img{width:70px;height:70px;border-radius:var(--radius-sm);background-size:cover;background-position:center;flex-shrink:0}
.ibl-cart__item-info{flex:1;min-width:0}
.ibl-cart__item-info h4{font-size:.9rem;font-weight:600;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ibl-cart__item-info .price{font-weight:700;color:var(--c-primary);font-size:.9rem}
.ibl-cart__item-qty{display:flex;align-items:center;gap:0;border:1px solid var(--c-border);border-radius:var(--radius-sm)}
.ibl-cart__item-qty button{width:32px;height:32px;font-size:.9rem;display:flex;align-items:center;justify-content:center}
.ibl-cart__item-qty span{width:32px;text-align:center;font-weight:600;font-size:.85rem}
.ibl-cart__item-remove{color:var(--c-muted);font-size:.9rem;cursor:pointer;padding:8px;transition:color .2s}
.ibl-cart__item-remove:hover{color:var(--c-danger)}
.ibl-cart__summary{background:var(--c-white);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-sm);position:sticky;top:80px}

/* CHECKOUT */
.ibl-checkout{padding:24px 0}
.ibl-checkout__steps{display:flex;gap:0;margin-bottom:32px;border-radius:var(--radius-sm);overflow:hidden}
.ibl-checkout__step{flex:1;padding:12px;text-align:center;font-size:.85rem;font-weight:600;
background:var(--c-surface);color:var(--c-muted);position:relative;transition:all .3s}
.ibl-checkout__step--active{background:var(--c-primary);color:#fff}
.ibl-checkout__step--done{background:#FFF0E0;color:var(--c-primary)}

/* ORDERS */
.ibl-order-card{background:var(--c-white);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow-sm);margin-bottom:14px}
.ibl-order-card__header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.ibl-order-card__id{font-weight:700;font-size:.95rem}
.ibl-order-card__items{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.ibl-order-card__item{display:flex;align-items:center;gap:10px;font-size:.85rem}
.ibl-order-card__item img{width:44px;height:44px;border-radius:var(--radius-sm);object-fit:cover}
.ibl-order-card__footer{display:flex;justify-content:space-between;align-items:center;padding-top:12px;
border-top:1px solid var(--c-border);flex-wrap:wrap;gap:8px}
.ibl-order-card__total{font-weight:700;font-size:1.05rem}

/* ORDER TIMELINE */
.ibl-timeline{padding:20px 0 20px 28px;position:relative}
.ibl-timeline::before{content:'';position:absolute;left:11px;top:28px;bottom:28px;width:2px;background:var(--c-border)}
.ibl-timeline__item{position:relative;padding:0 0 28px 28px}
.ibl-timeline__item:last-child{padding-bottom:0}
.ibl-timeline__dot{position:absolute;left:-22px;top:2px;width:20px;height:20px;border-radius:50%;
border:2px solid var(--c-border);background:var(--c-white);display:flex;align-items:center;justify-content:center;font-size:.6rem}
.ibl-timeline__item--done .ibl-timeline__dot{background:var(--c-success);border-color:var(--c-success);color:#fff}
.ibl-timeline__item--current .ibl-timeline__dot{background:var(--c-primary);border-color:var(--c-primary);color:#fff;
animation:pulse-dot 1.2s ease infinite}
.ibl-timeline__item--current::before{content:'';position:absolute;left:-27px;top:-3px;width:30px;height:30px;
border-radius:50%;background:rgba(255,122,0,0.2);animation:pulse-ring-dot 1.5s ease infinite}
.ibl-timeline__label{font-weight:600;font-size:.9rem}
.ibl-timeline__time{font-size:.75rem;color:var(--c-muted)}
@keyframes pulse-dot{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes pulse-ring-dot{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.8);opacity:0}}

/* DASHBOARD STATS */
.ibl-stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:28px}
.ibl-stat-card{background:var(--c-white);border-radius:var(--radius-md);padding:18px;box-shadow:var(--shadow-sm);
display:flex;flex-direction:column;gap:6px;transition:transform .2s}
.ibl-stat-card:hover{transform:translateY(-2px)}
.ibl-stat-card__icon{width:40px;height:40px;border-radius:var(--radius-sm);display:flex;align-items:center;
justify-content:center;font-size:1.1rem}
.ibl-stat-card__icon--primary{background:rgba(255,122,0,0.12);color:var(--c-primary)}
.ibl-stat-card__icon--success{background:rgba(22,163,74,0.12);color:var(--c-success)}
.ibl-stat-card__icon--purple{background:rgba(123,44,191,0.12);color:var(--c-secondary)}
.ibl-stat-card__icon--danger{background:rgba(220,38,38,0.12);color:var(--c-danger)}
.ibl-stat-card__icon--warning{background:rgba(245,158,11,0.12);color:var(--c-warning)}
.ibl-stat-card__icon--info{background:rgba(59,130,246,0.12);color:var(--c-info)}
.ibl-stat-card__value{font-size:1.6rem;font-weight:800;color:var(--c-dark);font-family:var(--font-heading)}
.ibl-stat-card__label{font-size:.8rem;color:var(--c-muted);font-weight:500}

/* MERCHANT/ADMIN LAYOUT */
.ibl-panel{display:flex;min-height:100vh;padding-top:var(--header-h)}
.ibl-panel__sidebar{width:240px;background:var(--c-white);border-right:1px solid var(--c-border);position:fixed;
top:var(--header-h);bottom:0;left:0;overflow-y:auto;padding:16px 0;z-index:50}
.ibl-panel__sidebar-item{display:flex;align-items:center;gap:12px;padding:11px 20px;color:var(--c-muted);
font-size:.9rem;font-weight:500;cursor:pointer;transition:all .2s;border-left:3px solid transparent}
.ibl-panel__sidebar-item:hover{background:var(--c-bg);color:var(--c-text)}
.ibl-panel__sidebar-item--active{background:rgba(255,122,0,0.08);color:var(--c-primary);
border-left-color:var(--c-primary);font-weight:600}
.ibl-panel__sidebar-item i{width:20px;text-align:center}
.ibl-panel__content{flex:1;margin-left:240px;padding:24px;min-height:calc(100vh - var(--header-h))}
.ibl-panel__page-title{font-size:1.4rem;margin-bottom:20px;color:var(--c-dark)}

/* DATA TABLE */
.ibl-table-wrap{overflow-x:auto;border-radius:var(--radius-md);border:1px solid var(--c-border);background:var(--c-white)}
.ibl-table{width:100%;border-collapse:collapse}
.ibl-table th{padding:12px 14px;text-align:left;font-size:.8rem;font-weight:600;color:var(--c-muted);
text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--c-border);background:var(--c-surface)}
.ibl-table td{padding:12px 14px;font-size:.85rem;border-bottom:1px solid var(--c-border);vertical-align:middle}
.ibl-table tr:last-child td{border-bottom:none}
.ibl-table tr:hover td{background:var(--c-bg)}

/* MODAL */
.ibl-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);z-index:var(--z-modal);
display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .25s}
.ibl-modal-overlay--active{opacity:1;pointer-events:auto}
.ibl-modal{background:var(--c-white);border-radius:var(--radius-lg);max-width:520px;width:100%;
max-height:90vh;overflow-y:auto;transform:translateY(20px) scale(0.97);transition:transform .3s ease;box-shadow:var(--shadow-xl)}
.ibl-modal-overlay--active .ibl-modal{transform:translateY(0) scale(1)}
.ibl-modal--lg{max-width:720px}
.ibl-modal__header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--c-border)}
.ibl-modal__header h3{font-size:1.1rem}
.ibl-modal__header .close-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
color:var(--c-muted);transition:background .2s;font-size:1.1rem;cursor:pointer}
.ibl-modal__header .close-btn:hover{background:var(--c-bg)}
.ibl-modal__body{padding:24px}
.ibl-modal__footer{padding:16px 24px;border-top:1px solid var(--c-border);display:flex;justify-content:flex-end;gap:10px}

/* LOCATION MODAL */
.ibl-location-modal{position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);z-index:180;
display:flex;align-items:center;justify-content:center;padding:20px}
.ibl-location-modal__card{background:var(--c-white);border-radius:var(--radius-xl);max-width:440px;
width:100%;padding:36px;text-align:center;box-shadow:var(--shadow-xl)}
.ibl-location-modal__card h2{font-size:1.5rem;margin-bottom:6px}
.ibl-location-modal__card p{color:var(--c-muted);margin-bottom:24px}
.ibl-location-modal__card .divider{color:var(--c-muted);font-size:.85rem;margin:18px 0}

/* TOAST */
.ibl-toast-container{position:fixed;top:80px;right:20px;z-index:var(--z-toast);display:flex;flex-direction:column;gap:10px;max-width:380px}
.ibl-toast{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:var(--radius-md);
background:var(--c-white);box-shadow:var(--shadow-lg);animation:toast-in .35s ease;font-size:.9rem;
border-left:4px solid var(--c-info)}
.ibl-toast--success{border-left-color:var(--c-success)}
.ibl-toast--error{border-left-color:var(--c-danger)}
.ibl-toast--warning{border-left-color:var(--c-warning)}
.ibl-toast i{font-size:1.1rem;flex-shrink:0}
.ibl-toast--success i{color:var(--c-success)}
.ibl-toast--error i{color:var(--c-danger)}
.ibl-toast--warning i{color:var(--c-warning)}
.ibl-toast--info i{color:var(--c-info)}
.ibl-toast__msg{flex:1}
.ibl-toast__close{cursor:pointer;color:var(--c-muted);padding:4px}
@keyframes toast-in{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes toast-out{from{transform:translateX(0);opacity:1}to{transform:translateX(100%);opacity:0}}

/* SKELETON */
.ibl-skeleton{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;
animation:skeleton-shimmer 1.5s ease-in-out infinite;border-radius:var(--radius-sm)}
@keyframes skeleton-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* LOADING OVERLAY */
.ibl-loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,0.8);backdrop-filter:blur(4px);
z-index:var(--z-loading);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.ibl-loading-overlay--active{display:flex}
.ibl-loading-spinner{width:44px;height:44px;border:3px solid var(--c-border);border-top-color:var(--c-primary);
border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* EMPTY STATE */
.ibl-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center}
.ibl-empty__icon{font-size:3.5rem;color:var(--c-border);margin-bottom:16px}
.ibl-empty h3{font-size:1.2rem;margin-bottom:6px;color:var(--c-dark)}
.ibl-empty p{color:var(--c-muted);font-size:.9rem;margin-bottom:20px;max-width:320px}

/* FILTERS */
.ibl-filter-bar{display:flex;gap:8px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.ibl-filter-bar::-webkit-scrollbar{display:none}
.ibl-filter-chip{padding:8px 16px;border-radius:var(--radius-full);border:1.5px solid var(--c-border);
font-size:.8rem;font-weight:500;white-space:nowrap;cursor:pointer;transition:all .2s;background:var(--c-white)}
.ibl-filter-chip:hover,.ibl-filter-chip--active{border-color:var(--c-primary);background:rgba(255,122,0,0.08);color:var(--c-primary)}

/* ORDER CONFIRMATION */
.ibl-confirmation{display:flex;flex-direction:column;align-items:center;justify-content:center;
padding:60px 20px;text-align:center;min-height:70vh}
.ibl-confirmation__check{width:80px;height:80px;border-radius:50%;background:var(--c-success);color:#fff;
display:flex;align-items:center;justify-content:center;font-size:2.5rem;margin-bottom:24px;
animation:pop-in .5s cubic-bezier(0.175,0.885,0.32,1.275)}
@keyframes pop-in{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}

/* REVIEWS */
.ibl-review{padding:14px 0;border-bottom:1px solid var(--c-border)}
.ibl-review:last-child{border-bottom:none}
.ibl-review__header{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.ibl-review__avatar{width:32px;height:32px;border-radius:50%;background:var(--c-bg);display:flex;
align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:var(--c-primary)}
.ibl-review__name{font-weight:600;font-size:.85rem}
.ibl-review__date{font-size:.75rem;color:var(--c-muted);margin-left:auto}
.ibl-review__stars{font-size:.8rem;color:#F59E0B;margin-bottom:4px}
.ibl-review__text{font-size:.85rem;color:var(--c-muted);line-height:1.6}

/* NOTIFICATION */
.ibl-notif-item{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--c-border);cursor:pointer;transition:background .2s}
.ibl-notif-item:hover{background:var(--c-bg)}
.ibl-notif-item--unread{background:rgba(255,122,0,0.04)}
.ibl-notif-item__icon{width:40px;height:40px;border-radius:50%;background:rgba(255,122,0,0.1);
display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--c-primary)}
.ibl-notif-item__body{flex:1;min-width:0}
.ibl-notif-item__title{font-weight:600;font-size:.9rem;margin-bottom:2px}
.ibl-notif-item__msg{font-size:.8rem;color:var(--c-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ibl-notif-item__time{font-size:.7rem;color:var(--c-muted);margin-top:2px}

/* ADDRESS CARD */
.ibl-address-card{background:var(--c-white);border-radius:var(--radius-md);padding:16px;border:1.5px solid var(--c-border);
cursor:pointer;transition:all .2s}
.ibl-address-card:hover,.ibl-address-card--selected{border-color:var(--c-primary)}
.ibl-address-card__label{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:var(--radius-full);
background:rgba(255,122,0,0.1);color:var(--c-primary);font-size:.75rem;font-weight:600;margin-bottom:8px}
.ibl-address-card__text{font-size:.85rem;color:var(--c-text);margin-bottom:4px}
.ibl-address-card__meta{font-size:.8rem;color:var(--c-muted)}
.ibl-address-card__actions{display:flex;gap:8px;margin-top:10px}

/* TABS */
.ibl-tabs{display:flex;gap:0;border-bottom:2px solid var(--c-border);margin-bottom:20px;overflow-x:auto}
.ibl-tabs__item{padding:10px 18px;font-size:.85rem;font-weight:600;color:var(--c-muted);cursor:pointer;
border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s;white-space:nowrap}
.ibl-tabs__item:hover{color:var(--c-text)}
.ibl-tabs__item--active{color:var(--c-primary);border-bottom-color:var(--c-primary)}

/* RESPONSIVE */
@media(max-width:1024px){
  .ibl-panel__sidebar{display:none}
  .ibl-panel__content{margin-left:0}
  .ibl-hero__animation{display:none}
  .ibl-product-detail__grid{grid-template-columns:1fr}
}
@media(max-width:768px){
  .ibl-bottom-nav{display:block}
  .ibl-main{padding-bottom:var(--bottom-nav-h)}
  .ibl-hero h1{font-size:1.8rem}
  .ibl-hero__animation{display:none}
  .ibl-auth__right{display:none}
  .ibl-auth__left{padding:24px}
  .ibl-header__search{display:none}
  .ibl-header__location span{max-width:100px}
  .ibl-products-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .ibl-product-card__img{height:140px}
  .ibl-stats-grid{grid-template-columns:repeat(2,1fr)}
  .ibl-shop-card__img{height:130px}
  .ibl-container{padding:0 14px}
  .ibl-product-detail__grid{grid-template-columns:1fr}
  .ibl-panel__sidebar{display:none}
  .ibl-panel__content{margin-left:0;padding:16px}
  .ibl-checkout__steps{font-size:.75rem}
}
@media(max-width:390px){
  .ibl-products-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .ibl-product-card__body{padding:8px}
  .ibl-product-card__name{font-size:.8rem}
  .ibl-hero h1{font-size:1.5rem}
}

/* UTILITY */
.hidden{display:none!important}
.text-center{text-align:center}
.text-muted{color:var(--c-muted)}
.mt-8{margin-top:8px}.mt-16{margin-top:16px}.mt-24{margin-top:24px}.mb-16{margin-bottom:16px}.mb-24{margin-bottom:24px}
.gap-8{gap:8px}.gap-12{gap:12px}
.flex{display:flex}.flex-col{flex-direction:column}.items-center{align-items:center}.justify-between{justify-content:space-between}
.flex-1{flex:1}.flex-wrap{flex-wrap:wrap}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.grid-2{grid-template-columns:1fr}}
.w-full{width:100%}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* MERCHANT MOBILE NAV */
.ibl-merchant-mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:var(--bottom-nav-h);
background:rgba(255,255,255,0.95);backdrop-filter:blur(12px);border-top:1px solid rgba(0,0,0,0.06);z-index:var(--z-header);padding-bottom:env(safe-area-inset-bottom)}
.ibl-merchant-mobile-nav__inner{display:flex;align-items:center;justify-content:space-around;height:100%}
@media(max-width:768px){.ibl-merchant-mobile-nav{display:block}}

/* FILTER DRAWER MOBILE */
.ibl-filter-drawer{position:fixed;bottom:0;left:0;right:0;background:var(--c-white);border-radius:var(--radius-xl) var(--radius-xl) 0 0;
max-height:80vh;overflow-y:auto;box-shadow:var(--shadow-xl);z-index:var(--z-modal);transform:translateY(100%);transition:transform .35s ease;padding:24px}
.ibl-filter-drawer--open{transform:translateY(0)}
.ibl-filter-drawer__handle{width:40px;height:4px;border-radius:2px;background:var(--c-border);margin:0 auto 16px}

/* SEARCH MOBILE */
.ibl-mobile-search{display:none;padding:10px 14px;background:var(--c-white);border-bottom:1px solid rgba(0,0,0,0.06);position:sticky;top:var(--header-h);z-index:40}
.ibl-mobile-search input{width:100%;padding:10px 14px 10px 38px;border-radius:var(--radius-full);border:1.5px solid var(--c-border);background:var(--c-surface);font-size:.9rem}
.ibl-mobile-search i{position:absolute;left:28px;top:50%;transform:translateY(-50%);color:var(--c-muted)}
@media(max-width:768px){.ibl-mobile-search{display:block}}

/* PAGINATION */
.ibl-pagination{display:flex;justify-content:center;gap:6px;padding:24px 0}
.ibl-pagination button{width:36px;height:36px;border-radius:var(--radius-sm);border:1px solid var(--c-border);
font-size:.85rem;font-weight:600;transition:all .2s;display:flex;align-items:center;justify-content:center}
.ibl-pagination button:hover{border-color:var(--c-primary);color:var(--c-primary)}
.ibl-pagination button.active{background:var(--c-primary);color:#fff;border-color:var(--c-primary)}

/* STAR INPUT */
.ibl-star-input{display:flex;gap:4px;font-size:1.5rem;cursor:pointer}
.ibl-star-input i{color:var(--c-border);transition:color .15s}
.ibl-star-input i.active{color:#F59E0B}
.ibl-star-input i:hover,.ibl-star-input i:hover ~ i{color:#FBBF24}

/* SHOPS GRID */
.ibl-shops-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
@media(max-width:640px){.ibl-shops-grid{grid-template-columns:1fr}}

/* IMAGE UPLOAD */
.ibl-upload{border:2px dashed var(--c-border);border-radius:var(--radius-md);padding:24px;text-align:center;
cursor:pointer;transition:all .25s;position:relative;background:var(--c-surface);min-height:140px;
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.ibl-upload:hover,.ibl-upload--dragover{border-color:var(--c-primary);background:rgba(255,122,0,0.04)}
.ibl-upload--has-image{padding:8px;border-style:solid;border-color:var(--c-primary)}
.ibl-upload__icon{font-size:2rem;color:var(--c-border);transition:color .2s}
.ibl-upload:hover .ibl-upload__icon{color:var(--c-primary)}
.ibl-upload__text{font-size:.85rem;color:var(--c-muted)}
.ibl-upload__text strong{color:var(--c-primary)}
.ibl-upload__hint{font-size:.72rem;color:var(--c-border)}
.ibl-upload__preview{width:100%;max-height:200px;object-fit:contain;border-radius:var(--radius-sm)}
.ibl-upload__remove{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;
background:rgba(220,38,38,0.9);color:#fff;display:flex;align-items:center;justify-content:center;
font-size:.75rem;cursor:pointer;z-index:2;transition:transform .15s;box-shadow:0 2px 6px rgba(0,0,0,0.2)}
.ibl-upload__remove:hover{transform:scale(1.15)}
.ibl-upload__progress{position:absolute;bottom:0;left:0;height:3px;background:var(--grad-orange);
border-radius:0 0 var(--radius-md) var(--radius-md);transition:width .3s}
.ibl-upload input[type="file"]{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:1}
.ibl-upload--has-image input[type="file"]{z-index:0}
</style>
</head>
<body>

<!-- LOADING OVERLAY -->
<div id="loading-overlay" class="ibl-loading-overlay">
  <div class="ibl-loading-spinner"></div>
  <p style="color:var(--c-muted);font-size:.9rem">Loading...</p>
</div>

<!-- TOAST CONTAINER -->
<div id="toast-container" class="ibl-toast-container"></div>

<!-- AUTH SCREEN -->
<div id="auth-screen" class="ibl-auth hidden">
  <div class="ibl-auth__left">
    <div class="ibl-auth__form">
      <div style="margin-bottom:24px;cursor:pointer" onclick="navigateTo('#/home')">
        <span style="font-family:var(--font-heading);font-size:2rem;font-weight:800;background:var(--grad-brand);-webkit-background-clip:text;-webkit-text-fill-color:transparent">IBL</span>
      </div>
      <div id="auth-content"></div>
    </div>
  </div>
  <div class="ibl-auth__right">
    <h2>Local Shops.<br>Local Products.<br>Delivered.</h2>
    <p style="margin-top:16px">Discover your neighbourhood marketplace. Buy local. Sell local.</p>
    <div class="ibl-rider-anim" style="margin-top:40px;width:300px">
      <div class="ibl-rider-anim__shop"><i class="fas fa-store"></i><span>Shop</span></div>
      <div class="ibl-rider-anim__dest"><i class="fas fa-map-marker-alt"></i><span>You</span></div>
      <div class="ibl-rider-anim__road"></div>
      <div class="ibl-rider-anim__rider"><div class="ibl-rider-anim__scooter">🛵</div></div>
    </div>
  </div>
</div>

<!-- LOCATION MODAL -->
<div id="location-modal" class="ibl-location-modal hidden">
  <div class="ibl-location-modal__card">
    <i class="fas fa-map-marker-alt" style="font-size:2.5rem;color:var(--c-primary);margin-bottom:12px"></i>
    <h2>Where should we deliver?</h2>
    <p>Set your location so we can show nearby shops and products.</p>
    <button class="ibl-btn ibl-btn--primary ibl-btn--full" onclick="requestGeoLocation()">
      <i class="fas fa-crosshairs"></i> Use my current location
    </button>
    <div class="divider">— or —</div>
    <div id="manual-location-form">
      <div class="ibl-form-group"><input type="text" id="loc-address" placeholder="Enter your area or address"></div>
      <div class="grid-2">
        <div class="ibl-form-group"><input type="text" id="loc-city" placeholder="City"></div>
        <div class="ibl-form-group"><input type="text" id="loc-pincode" placeholder="Pincode"></div>
      </div>
      <button class="ibl-btn ibl-btn--secondary ibl-btn--full" onclick="setManualLocation()">Set Location</button>
    </div>
    <button class="ibl-btn ibl-btn--ghost ibl-btn--full mt-16" onclick="skipLocation()" style="font-size:.85rem">Skip for now</button>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" class="hidden">
  <!-- HEADER -->
  <header class="ibl-header" id="app-header">
    <div class="ibl-header__logo" onclick="navigateTo('#/home')">IBL</div>
    <div class="ibl-header__location" id="header-location" onclick="showLocationModal()">
      <i class="fas fa-map-marker-alt"></i>
      <span id="header-location-text">Set location</span>
      <i class="fas fa-chevron-down" style="font-size:.6rem;color:var(--c-muted)"></i>
    </div>
    <div class="ibl-header__search">
      <i class="fas fa-search"></i>
      <input type="text" id="header-search" placeholder="Search products, shops..." onkeydown="if(event.key==='Enter')doSearch(this.value)">
    </div>
    <div class="ibl-header__actions">
      <button class="ibl-header__action-btn" onclick="navigateTo('#/wishlist')" title="Wishlist"><i class="fas fa-heart"></i></button>
      <button class="ibl-header__action-btn" onclick="navigateTo('#/notifications')" title="Notifications">
        <i class="fas fa-bell"></i><span id="notif-badge" class="badge-count hidden">0</span>
      </button>
      <button class="ibl-header__action-btn" onclick="navigateTo('#/cart')" title="Cart">
        <i class="fas fa-shopping-bag"></i><span id="cart-badge" class="badge-count hidden">0</span>
      </button>
      <div class="ibl-header__user-btn" id="header-user-btn" onclick="navigateTo('#/account')">
        <div class="avatar" id="header-avatar">?</div>
        <span id="header-user-name" style="max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Account</span>
      </div>
    </div>
  </header>

  <!-- MOBILE SEARCH -->
  <div class="ibl-mobile-search" style="position:relative">
    <i class="fas fa-search"></i>
    <input type="text" id="mobile-search" placeholder="Search products, shops..." onkeydown="if(event.key==='Enter')doSearch(this.value)">
  </div>

  <!-- MAIN CONTENT -->
  <main class="ibl-main" id="main-content"></main>

  <!-- BOTTOM NAV (Customer) -->
  <nav class="ibl-bottom-nav" id="bottom-nav">
    <div class="ibl-bottom-nav__inner">
      <div class="ibl-bottom-nav__item" data-nav="home" onclick="navigateTo('#/home')"><i class="fas fa-home"></i><span>Home</span></div>
      <div class="ibl-bottom-nav__item" data-nav="explore" onclick="navigateTo('#/explore')"><i class="fas fa-search"></i><span>Explore</span></div>
      <div class="ibl-bottom-nav__item" data-nav="cart" onclick="navigateTo('#/cart')">
        <i class="fas fa-shopping-bag"></i><span>Cart</span>
        <span id="bottom-cart-badge" class="badge-count hidden">0</span>
      </div>
      <div class="ibl-bottom-nav__item" data-nav="orders" onclick="navigateTo('#/orders')"><i class="fas fa-box"></i><span>Orders</span></div>
      <div class="ibl-bottom-nav__item" data-nav="account" onclick="navigateTo('#/account')"><i class="fas fa-user"></i><span>Account</span></div>
    </div>
  </nav>
</div>

<!-- GENERIC MODAL -->
<div id="modal-overlay" class="ibl-modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="ibl-modal" id="modal-container">
    <div class="ibl-modal__header">
      <h3 id="modal-title">Modal</h3>
      <div class="close-btn" onclick="closeModal()"><i class="fas fa-times"></i></div>
    </div>
    <div class="ibl-modal__body" id="modal-body"></div>
    <div class="ibl-modal__footer hidden" id="modal-footer"></div>
  </div>
</div>

<!-- FILTER DRAWER (Mobile) -->
<div id="filter-backdrop" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:199" onclick="closeFilterDrawer()"></div>
<div id="filter-drawer" class="ibl-filter-drawer">
  <div class="ibl-filter-drawer__handle"></div>
  <div id="filter-drawer-content"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>

// =====================================================================
// IBL FRONTEND — CORE JAVASCRIPT
// =====================================================================

// ── CONFIG ──
const API_URL = "https://script.google.com/macros/s/AKfycbw_7p9BJGEERRsJEWkQT29-dsVNfqLJkjJQk-fPzUtMJwslz1Y7SnHgMHoX2oB2Rd1niA/exec";
const DEBUG = false;

// ── STATE ──
const STATE = {
  user: null,
  token: localStorage.getItem('ibl_token') || '',
  location: JSON.parse(localStorage.getItem('ibl_location') || 'null'),
  cart: { groups: [], subtotal: 0 },
  categories: [],
  currentPage: '',
  pageParams: {},
  recentSearches: JSON.parse(localStorage.getItem('ibl_recent_searches') || '[]'),
  notificationCount: 0,
  cartCount: 0,
  refreshTimers: {},
  wishlistIds: new Set(),
  checkoutAddress: null,
  checkoutCoupon: null,
  checkoutStep: 1
};

// ── API CLIENT ──
const API = {
  async call(action, params = {}) {
    if (STATE.token) params.token = STATE.token;
    params.action = action;
    const url = API_URL;
    if (DEBUG) console.log('[API →]', action, params);
    try {
      const resp = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(params),
        redirect: 'follow'
      });
      const data = await resp.json();
      if (DEBUG) console.log('[API ←]', action, data);
      if (!data.success && data.error === 'AUTH_REQUIRED') {
        clearSession();
        showAuthScreen('login');
        showToast('Session expired. Please log in again.', 'warning');
      }
      return data;
    } catch (err) {
      if (DEBUG) console.error('[API ERR]', action, err);
      return { success: false, message: 'Network error. Please check your connection.', error: 'NETWORK_ERROR' };
    }
  },
  get(action, params) { return this.call(action, params); },
  post(action, params) { return this.call(action, params); }
};

// ── AUTH ──
function clearSession() {
  STATE.user = null;
  STATE.token = '';
  STATE.cart = { groups: [], subtotal: 0 };
  STATE.cartCount = 0;
  STATE.wishlistIds = new Set();
  localStorage.removeItem('ibl_token');
  updateCartBadge();
  updateNotifBadge();
}

async function restoreSession() {
  if (!STATE.token) return false;
  showLoading();
  const res = await API.call('me');
  hideLoading();
  if (res.success && res.data && res.data.user) {
    STATE.user = res.data.user;
    updateUserUI();
    return true;
  }
  clearSession();
  return false;
}

async function doLogin(email, password) {
  if (!email || !password) return showToast('Email and password are required.', 'error');
  showLoading();
  const res = await API.post('login', { email, password });
  hideLoading();
  if (res.success) {
    STATE.token = res.data.token;
    STATE.user = res.data.user;
    localStorage.setItem('ibl_token', STATE.token);
    updateUserUI();
    hideAuthScreen();
    showToast('Welcome back, ' + escapeHtml(STATE.user.name) + '!', 'success');
    loadCartAndWishlist();
    routeByRole();
  } else {
    showToast(res.message, 'error');
  }
}

async function doRegister(data) {
  if (!data.name || !data.email || !data.password || !data.phone) return showToast('All fields are required.', 'error');
  if (data.password.length < 6) return showToast('Password must be at least 6 characters.', 'error');
  if (data.password !== data.confirmPassword) return showToast('Passwords do not match.', 'error');
  showLoading();
  const res = await API.post('register', { name: data.name, email: data.email, password: data.password, phone: data.phone, role: data.role || 'customer' });
  hideLoading();
  if (res.success) {
    STATE.token = res.data.token;
    STATE.user = res.data.user;
    localStorage.setItem('ibl_token', STATE.token);
    updateUserUI();
    hideAuthScreen();
    if (data.role === 'merchant') {
      showToast('Merchant application submitted! Awaiting admin approval.', 'info');
    } else {
      showToast('Welcome to IBL, ' + escapeHtml(STATE.user.name) + '!', 'success');
    }
    loadCartAndWishlist();
    routeByRole();
  } else {
    showToast(res.message, 'error');
  }
}

async function doLogout() {
  await API.post('logout');
  clearSession();
  showToast('Logged out successfully.', 'info');
  navigateTo('#/home');
  updateUserUI();
}

async function loadCartAndWishlist() {
  if (!STATE.token) return;
  const [cartRes, wishRes] = await Promise.all([API.get('getCart'), API.get('getWishlist')]);
  if (cartRes.success) {
    STATE.cart = cartRes.data.cart;
    STATE.cartCount = STATE.cart.groups.reduce((s, g) => s + g.items.length, 0);
    updateCartBadge();
  }
  if (wishRes.success) {
    STATE.wishlistIds = new Set((wishRes.data.wishlist || []).map(p => p.ProductID));
  }
}

function routeByRole() {
  if (!STATE.user) { navigateTo('#/home'); return; }
  if (STATE.user.role === 'admin') navigateTo('#/admin');
  else if (STATE.user.role === 'merchant') navigateTo('#/merchant');
  else navigateTo('#/home');
}

// ── UI HELPERS ──
function showLoading() { document.getElementById('loading-overlay').classList.add('ibl-loading-overlay--active'); }
function hideLoading() { document.getElementById('loading-overlay').classList.remove('ibl-loading-overlay--active'); }

function showToast(message, type = 'info') {
  const container = document.getElementById('toast-container');
  const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle', info: 'fa-info-circle' };
  const el = document.createElement('div');
  el.className = 'ibl-toast ibl-toast--' + type;
  el.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i><div class="ibl-toast__msg">${escapeHtml(message)}</div><div class="ibl-toast__close" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></div>`;
  container.appendChild(el);
  setTimeout(() => { if (el.parentElement) { el.style.animation = 'toast-out .3s forwards'; setTimeout(() => el.remove(), 300); } }, 4000);
}

function showModal(title, bodyHtml, footerHtml, isLarge) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  const footer = document.getElementById('modal-footer');
  if (footerHtml) { footer.innerHTML = footerHtml; footer.classList.remove('hidden'); }
  else { footer.classList.add('hidden'); }
  const container = document.getElementById('modal-container');
  container.className = 'ibl-modal' + (isLarge ? ' ibl-modal--lg' : '');
  document.getElementById('modal-overlay').classList.add('ibl-modal-overlay--active');
}

function closeModal() { document.getElementById('modal-overlay').classList.remove('ibl-modal-overlay--active'); }

function openFilterDrawer() {
  document.getElementById('filter-drawer').classList.add('ibl-filter-drawer--open');
  document.getElementById('filter-backdrop').classList.remove('hidden');
}
function closeFilterDrawer() {
  document.getElementById('filter-drawer').classList.remove('ibl-filter-drawer--open');
  document.getElementById('filter-backdrop').classList.add('hidden');
}

function showAuthScreen(mode) {
  document.getElementById('auth-screen').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
  renderAuthContent(mode || 'login');
}

function hideAuthScreen() {
  document.getElementById('auth-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
}

function showLocationModal() { document.getElementById('location-modal').classList.remove('hidden'); }
function hideLocationModal() { document.getElementById('location-modal').classList.add('hidden'); }

// ── FORMAT HELPERS ──
function formatPrice(amount) {
  const n = Number(amount);
  if (isNaN(n)) return '₹0';
  return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(n);
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
}

function formatDateTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function timeAgo(iso) {
  if (!iso) return '';
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
  return formatDate(iso);
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  const div = document.createElement('div');
  div.textContent = String(str);
  return div.innerHTML;
}

function renderStarRating(rating) {
  const r = Math.round(Number(rating) * 2) / 2;
  let html = '';
  for (let i = 1; i <= 5; i++) {
    if (i <= Math.floor(r)) html += '<i class="fas fa-star"></i>';
    else if (i - 0.5 <= r) html += '<i class="fas fa-star-half-alt"></i>';
    else html += '<i class="far fa-star"></i>';
  }
  return html;
}

function getDiscountPct(price, discountPrice) {
  if (!discountPrice || discountPrice >= price) return 0;
  return Math.round((1 - discountPrice / price) * 100);
}

function getPlaceholderImg(text) {
  const t = encodeURIComponent(String(text || 'IBL').charAt(0).toUpperCase());
  return `data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200' viewBox='0 0 200 200'><rect width='200' height='200' fill='%23FFF0E0'/><text x='100' y='115' font-family='sans-serif' font-size='72' font-weight='bold' fill='%23FF7A00' text-anchor='middle'>${t}</text></svg>`;
}

function imgError(el) { el.onerror = null; el.src = getPlaceholderImg(el.alt || 'P'); }

function bgImg(url, fallbackText) {
  return url ? `background-image:url('${escapeHtml(url)}'),url('${getPlaceholderImg(fallbackText)}')` : `background-image:url('${getPlaceholderImg(fallbackText)}')`;
}

// ── IMAGE UPLOAD UTILITY ──
function compressImage(file, maxWidth, quality) {
  maxWidth = maxWidth || 600;
  quality = quality || 0.7;
  return new Promise((resolve, reject) => {
    if (!file || !file.type.startsWith('image/')) { reject('Please select an image file.'); return; }
    if (file.size > 10 * 1024 * 1024) { reject('Image must be under 10 MB.'); return; }
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        resolve(dataUrl);
      };
      img.onerror = () => reject('Failed to load image.');
      img.src = e.target.result;
    };
    reader.onerror = () => reject('Failed to read file.');
    reader.readAsDataURL(file);
  });
}

function imageUploadHtml(inputId, existingUrl) {
  const hasImg = !!existingUrl;
  return `<div class="ibl-form-group"><label>Image</label>
    <div class="ibl-upload ${hasImg ? 'ibl-upload--has-image' : ''}" id="${inputId}-drop"
         ondragover="event.preventDefault();this.classList.add('ibl-upload--dragover')"
         ondragleave="this.classList.remove('ibl-upload--dragover')"
         ondrop="event.preventDefault();this.classList.remove('ibl-upload--dragover');handleFileDrop(event,'${inputId}')">
      <input type="file" accept="image/*" onchange="handleFileSelect(event,'${inputId}')">
      <input type="hidden" id="${inputId}" value="${escapeHtml(existingUrl || '')}">
      <div id="${inputId}-placeholder" class="${hasImg ? 'hidden' : ''}">
        <div class="ibl-upload__icon"><i class="fas fa-cloud-arrow-up"></i></div>
        <div class="ibl-upload__text"><strong>Click to upload</strong> or drag & drop</div>
        <div class="ibl-upload__hint">JPG, PNG, WebP · Max 10 MB · Auto-compressed</div>
      </div>
      <img id="${inputId}-preview" class="ibl-upload__preview ${hasImg ? '' : 'hidden'}" src="${escapeHtml(existingUrl || '')}" onerror="this.classList.add('hidden')">
      <div id="${inputId}-remove" class="ibl-upload__remove ${hasImg ? '' : 'hidden'}" onclick="event.stopPropagation();clearUpload('${inputId}')"><i class="fas fa-times"></i></div>
    </div>
  </div>`;
}

async function handleFileSelect(event, inputId) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  await processUploadFile(file, inputId);
}

async function handleFileDrop(event, inputId) {
  const file = event.dataTransfer.files && event.dataTransfer.files[0];
  if (!file) return;
  await processUploadFile(file, inputId);
}

async function processUploadFile(file, inputId) {
  const dropZone = document.getElementById(inputId + '-drop');
  const placeholder = document.getElementById(inputId + '-placeholder');
  const preview = document.getElementById(inputId + '-preview');
  const removeBtn = document.getElementById(inputId + '-remove');
  const hiddenInput = document.getElementById(inputId);

  try {
    // Show loading state
    placeholder.innerHTML = '<div class="ibl-loading-spinner" style="width:28px;height:28px;border-width:2px"></div><div class="ibl-upload__text">Compressing...</div>';
    placeholder.classList.remove('hidden');
    preview.classList.add('hidden');

    const dataUrl = await compressImage(file, 600, 0.7);

    // Show preview
    hiddenInput.value = dataUrl;
    preview.src = dataUrl;
    preview.classList.remove('hidden');
    placeholder.classList.add('hidden');
    removeBtn.classList.remove('hidden');
    dropZone.classList.add('ibl-upload--has-image');

    // Restore placeholder content for next time
    placeholder.innerHTML = '<div class="ibl-upload__icon"><i class="fas fa-cloud-arrow-up"></i></div><div class="ibl-upload__text"><strong>Click to upload</strong> or drag & drop</div><div class="ibl-upload__hint">JPG, PNG, WebP · Max 10 MB · Auto-compressed</div>';

    showToast('Image ready!', 'success');
  } catch (err) {
    showToast(String(err), 'error');

// ── LOCATION ──
function requestGeoLocation() {
  if (!navigator.geolocation) { showToast('Geolocation is not supported by your browser.', 'error'); return; }
  showLoading();
  navigator.geolocation.getCurrentPosition(
    pos => {
      hideLoading();
      setLocation(pos.coords.latitude, pos.coords.longitude, 'Current Location');
      hideLocationModal();
      showToast('Location set!', 'success');
      if (STATE.currentPage === 'home') renderHomePage();
    },
    err => {
      hideLoading();
      showToast('Location access denied. Please enter your address manually.', 'warning');
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

function setManualLocation() {
  const address = document.getElementById('loc-address').value.trim();
  const city = document.getElementById('loc-city').value.trim();
  if (!address && !city) { showToast('Please enter your area or city.', 'error'); return; }
  setLocation(null, null, [address, city, document.getElementById('loc-pincode').value.trim()].filter(Boolean).join(', '));
  hideLocationModal();
  showToast('Location set!', 'success');
  if (STATE.currentPage === 'home') renderHomePage();
}

function skipLocation() {
  hideLocationModal();
  if (STATE.currentPage === 'home') renderHomePage();
}

function setLocation(lat, lng, label) {
  STATE.location = { lat, lng, label: label || 'My Location' };
  localStorage.setItem('ibl_location', JSON.stringify(STATE.location));
  updateLocationUI();
}

function updateLocationUI() {

// ── ROUTER ──
function navigateTo(hash) {
  window.location.hash = hash;
}

function parseHash() {
  const h = window.location.hash || '#/home';
  const parts = h.replace('#/', '').split('?');
  const path = parts[0] || 'home';
  const params = {};
  if (parts[1]) {
    parts[1].split('&').forEach(p => {
      const [k, v] = p.split('=');
      if (k) params[decodeURIComponent(k)] = decodeURIComponent(v || '');
    });
  }
  return { path, params };
}

function handleRoute() {
  const { path, params } = parseHash();
  STATE.pageParams = params;
  clearRefreshTimers();

  // Decide which page
  const segments = path.split('/');
  const page = segments[0];
  const sub = segments.slice(1).join('/');
  STATE.currentPage = path;

  // Auth check for protected pages
  const protectedMerchant = ['merchant', 'merchant/products', 'merchant/orders', 'merchant/shop', 'merchant/dashboard'];
  const protectedAdmin = ['admin', 'admin/users', 'admin/merchants', 'admin/shops', 'admin/products', 'admin/orders', 'admin/categories', 'admin/coupons', 'admin/reports'];

  if (protectedMerchant.includes(path) && (!STATE.user || (STATE.user.role !== 'merchant' && STATE.user.role !== 'admin'))) {
    showAuthScreen('login');
    return;
  }
  if (protectedAdmin.includes(path) && (!STATE.user || STATE.user.role !== 'admin')) {
    showAuthScreen('login');
    return;
  }

  // Update bottom nav
  updateBottomNav(page);
  updateHeaderForRole();

  // Route
  const routes = {
    'home': renderHomePage,
    'explore': renderExplorePage,
    'shop': () => renderShopPage(params.id),
    'product': () => renderProductPage(params.id),
    'cart': renderCartPage,
    'checkout': renderCheckoutPage,
    'orders': renderOrdersPage,
    'order': () => renderOrderDetailPage(params.id),
    'track': () => renderTrackOrderPage(params.id),
    'wishlist': renderWishlistPage,
    'account': renderAccountPage,
    'notifications': renderNotificationsPage,
    'addresses': renderAddressesPage,
    'merchant': renderMerchantDashboard,
    'merchant/products': renderMerchantProducts,
    'merchant/orders': renderMerchantOrders,
    'merchant/shop': renderMerchantShop,
    'admin': renderAdminDashboard,
    'admin/users': renderAdminUsers,
    'admin/merchants': renderAdminMerchants,
    'admin/shops': renderAdminShops,
    'admin/products': renderAdminProducts,
    'admin/orders': renderAdminOrders,
    'admin/categories': renderAdminCategories,
    'admin/coupons': renderAdminCoupons,
    'admin/reports': renderAdminReports,
    'confirmation': renderOrderConfirmation
  };

  const fn = routes[path];
  if (fn) { fn(); } else { renderHomePage(); }
  window.scrollTo(0, 0);
}

function updateBottomNav(page) {
  const isPanel = page === 'merchant' || page === 'admin';
  document.getElementById('bottom-nav').classList.toggle('hidden', isPanel);
  document.querySelectorAll('.ibl-bottom-nav__item').forEach(el => {
    el.classList.toggle('ibl-bottom-nav__item--active', el.dataset.nav === page);
  });
}

function updateHeaderForRole() {
  // Show/hide bottom nav based on role and page
  const isMerchant = STATE.currentPage.startsWith('merchant');
  const isAdmin = STATE.currentPage.startsWith('admin');
  if (isMerchant || isAdmin) {
    document.getElementById('bottom-nav').classList.add('hidden');
  }
}

function clearRefreshTimers() {
  Object.values(STATE.refreshTimers).forEach(t => clearInterval(t));
  STATE.refreshTimers = {};
}

function doSearch(q) {
  q = q.trim();
  if (!q) return;
  // Save to recent
  STATE.recentSearches = [q, ...STATE.recentSearches.filter(s => s !== q)].slice(0, 8);
  localStorage.setItem('ibl_recent_searches', JSON.stringify(STATE.recentSearches));
  navigateTo('#/explore?q=' + encodeURIComponent(q));
}

    API.get('getCategories'),

    API.get('getProducts', { ...locP, pageSize: '8', sort: 'rating' }),
    API.get('getProducts', { ...locP, pageSize: '8', discount: '1', sort: 'price_low' })

    STATE.categories = catRes.data.categories;

async function reloadExplore(page) {
  const params = { pageSize: '24', page: String(page || 1) };
  if (STATE.pageParams.q) params.q = STATE.pageParams.q;
  if (STATE.pageParams.category) params.category = STATE.pageParams.category;
  if (STATE.location && STATE.location.lat) { params.lat = STATE.location.lat; params.lng = STATE.location.lng; }
  const sortEl = document.getElementById('explore-sort');
  if (sortEl) params.sort = sortEl.value;
  // Extra filters
  const fp = STATE.pageParams;
  if (fp.minPrice) params.minPrice = fp.minPrice;
  if (fp.maxPrice) params.maxPrice = fp.maxPrice;
  if (fp.minRating) params.minRating = fp.minRating;
  if (fp.inStock) params.inStock = '1';
  if (fp.discount) params.discount = '1';

  const res = await API.get('getProducts', params);
  const el = document.getElementById('explore-results');
  if (!el) return;
  if (res.success && res.data.products.length) {
    el.innerHTML = `<div class="ibl-products-grid">${res.data.products.map(renderProductCard).join('')}</div>`;
    renderPagination(res.data.total, res.data.page, res.data.pageSize);
  } else {
    el.innerHTML = emptyState('fa-search', 'No products found', 'Try adjusting your search or filters.', 'Clear Filters', "STATE.pageParams={};navigateTo('#/explore')");
    document.getElementById('explore-pagination').innerHTML = '';
  }
}

function renderPagination(total, page, pageSize) {
  const pages = Math.ceil(total / pageSize);
  if (pages <= 1) { document.getElementById('explore-pagination').innerHTML = ''; return; }
  let html = '';
  for (let i = 1; i <= Math.min(pages, 8); i++) {
    html += `<button class="${i === page ? 'active' : ''}" onclick="reloadExplore(${i})">${i}</button>`;
  }
  document.getElementById('explore-pagination').innerHTML = html;
}

function openExploreFilters() {
  const fp = STATE.pageParams;
  document.getElementById('filter-drawer-content').innerHTML = `
    <h3 style="margin-bottom:16px">Filters</h3>
    <div class="ibl-form-group"><label>Min Price</label><input type="number" id="f-min-price" value="${fp.minPrice || ''}" placeholder="₹0"></div>
    <div class="ibl-form-group"><label>Max Price</label><input type="number" id="f-max-price" value="${fp.maxPrice || ''}" placeholder="₹10000"></div>
    <div class="ibl-form-group"><label>Min Rating</label>
      <select id="f-min-rating" style="width:100%"><option value="">Any</option><option value="4" ${fp.minRating === '4' ? 'selected' : ''}>4+ Stars</option><option value="3" ${fp.minRating === '3' ? 'selected' : ''}>3+ Stars</option></select>
    </div>
    <div class="ibl-form-group"><label><input type="checkbox" id="f-instock" ${fp.inStock ? 'checked' : ''}> In Stock Only</label></div>
    <div class="ibl-form-group"><label><input type="checkbox" id="f-discount" ${fp.discount ? 'checked' : ''}> Discounted Only</label></div>
    <div class="flex gap-8 mt-16">
      <button class="ibl-btn ibl-btn--ghost flex-1" onclick="STATE.pageParams.minPrice='';STATE.pageParams.maxPrice='';STATE.pageParams.minRating='';STATE.pageParams.inStock='';STATE.pageParams.discount='';closeFilterDrawer();reloadExplore()">Clear</button>
      <button class="ibl-btn ibl-btn--primary flex-1" onclick="applyExploreFilters()">Apply</button>
    </div>`;
  openFilterDrawer();
}

function applyExploreFilters() {
  STATE.pageParams.minPrice = document.getElementById('f-min-price').value;
  STATE.pageParams.maxPrice = document.getElementById('f-max-price').value;
  STATE.pageParams.minRating = document.getElementById('f-min-rating').value;
  STATE.pageParams.inStock = document.getElementById('f-instock').checked ? '1' : '';
  STATE.pageParams.discount = document.getElementById('f-discount').checked ? '1' : '';
  closeFilterDrawer();
  reloadExplore();
}

// ── SHOP PAGE ──
